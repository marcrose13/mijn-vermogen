<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mijn Vermogen</title>

    <style>

        :root {
            --app-background: #C5DEDE;
        }

        html {
            background: var(--app-background);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--app-background);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: #111827;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding:
                calc(20px + env(safe-area-inset-top))
                16px
                calc(30px + env(safe-area-inset-bottom))
                16px;
            box-sizing: border-box;
        }


        /*
         * ==========================================
         * TITEL + INSTELLINGEN
         * ==========================================
         */

        .header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0 25px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .instellingen-button {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);

            width: 42px;
            height: 42px;

            border: none;
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.75);

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .instellingen-button:active {
            transform:
                translateY(-50%)
                scale(0.94);
        }

        .instellingen-button:hover {
            background: white;
        }

        .instellingen-icoon {
            width: 21px;
            height: 21px;

            fill: none;
            stroke: #111827;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }


        h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .total-card {
            text-align: center;
            padding: 25px 20px;
        }

        .total-label {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        #total-vermogen {
            font-size: 36px;
            font-weight: 700;
        }

        .groei-info {
            margin-top: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #6b7280;
        }

        .periode-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .periode-buttons button {
            flex: 1;
            min-height: 42px;
            border: none;
            border-radius: 10px;
            background: #e5e7eb;
            color: #374151;
            font-size: 14px;
            cursor: pointer;
        }

        .periode-buttons button.active {
            background: #111827;
            color: white;
        }


        /*
         * ==========================================
         * GRAFIEK
         * ==========================================
         */

        .grafiek-container {
            position: relative;
            width: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 100%;
            touch-action: none;
        }


        /*
         * ==========================================
         * GRAFIEK TOOLTIP
         * ==========================================
         */

        .grafiek-tooltip {
            position: absolute;

            min-width: 155px;
            max-width: 210px;

            padding: 12px 14px;

            background: rgba(17, 24, 39, 0.96);
            color: white;

            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.18);

            pointer-events: none;

            opacity: 0;

            transform:
                translate(-50%, -100%)
                translateY(-12px);

            transition:
                opacity 0.12s ease;

            z-index: 20;

            box-sizing: border-box;
        }

        .grafiek-tooltip.visible {
            opacity: 1;
        }

        .tooltip-datum {
            font-size: 12px;
            color: #d1d5db;
            margin-bottom: 4px;
        }

        .tooltip-bedrag {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .tooltip-verschil {
            font-size: 12px;
            color: #d1d5db;
        }


        /*
         * ==========================================
         * REKENINGEN
         * ==========================================
         */

        .rekening {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .rekening:last-child {
            border-bottom: none;
        }

        .rekening-info {
            flex: 1;
            min-width: 0;
        }

        .rekening-naam {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .rekening-type {
            font-size: 13px;
            color: #6b7280;
        }

        .rekening-bedrag {
            font-weight: 700;
            white-space: nowrap;
        }

        .rekening-acties {
            display: flex;
            gap: 6px;
        }

        .rekening-acties button {
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            background: #f3f4f6;
            cursor: pointer;
        }


        /*
         * ==========================================
         * KNOPPEN
         * ==========================================
         */

        .primary-button {
            width: 100%;
            min-height: 50px;
            border: none;
            border-radius: 12px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .secondary-button {
            width: 100%;
            min-height: 45px;
            border: none;
            border-radius: 12px;
            background: #e5e7eb;
            color: #111827;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .danger-button {
            width: 100%;
            min-height: 45px;
            border: none;
            border-radius: 12px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }


        /*
         * ==========================================
         * HISTORIE
         * ==========================================
         */

        .historie-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .historie-item:last-child {
            border-bottom: none;
        }

        .historie-datum {
            color: #6b7280;
            flex: 1;
        }

        .leeg {
            color: #6b7280;
            text-align: center;
            padding: 10px 0;
        }


        /*
         * ==========================================
         * INSTELLINGEN POPUP
         * ==========================================
         */

        .instellingen-popup-overlay {
            position: fixed;
            inset: 0;

            background: rgba(17, 24, 39, 0.45);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
            box-sizing: border-box;

            z-index: 10000;
        }

        .instellingen-popup {
            width: 100%;
            max-width: 380px;

            background: white;

            border-radius: 22px;

            padding: 24px;

            box-sizing: border-box;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .instellingen-titel {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .instellingen-subtitel {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }

        .instellingen-label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .kleur-opties {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .kleur-optie {
            flex: 1;

            border: 2px solid transparent;

            border-radius: 14px;

            padding: 6px;

            background: #f3f4f6;

            cursor: pointer;

            transition:
                border-color 0.15s ease,
                transform 0.15s ease;
        }

        .kleur-optie:hover {
            transform: translateY(-2px);
        }

        .kleur-optie.active {
            border-color: #111827;
        }

        .kleur-preview {
            width: 100%;
            height: 55px;

            border-radius: 9px;

            margin-bottom: 7px;
        }

        .kleur-naam {
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            color: #374151;
        }


        /*
         * ==========================================
         * REKENING POPUP
         * ==========================================
         */

        .rekening-popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(17, 24, 39, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 9999;
        }

        .rekening-popup {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 22px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .rekening-popup-titel {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .rekening-popup-subtitel {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 22px;
        }

        .formulier-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .formulier-groep {
            margin-bottom: 17px;
        }

        .formulier-input,
        .formulier-select {
            width: 100%;
            min-height: 48px;
            padding: 0 13px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 11px;
            background: white;
            color: #111827;
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }

        .formulier-input:focus,
        .formulier-select:focus {
            border-color: #111827;
        }

        .popup-knoppen {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .popup-knoppen button {
            flex: 1;
        }


        /*
         * ==========================================
         * KLEINERE SCHERMEN
         * ==========================================
         */

        @media (max-width: 380px) {

            .container {
                padding-left: 12px;
                padding-right: 12px;
            }

            #total-vermogen {
                font-size: 32px;
            }

            .section {
                padding: 17px;
            }

            .rekening-acties button {
                padding: 7px 8px;
            }

            .rekening-popup {
                padding: 20px;
            }

            .instellingen-popup {
                padding: 20px;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- TITEL + INSTELLINGEN -->

    <div class="header">

        <h1>Mijn Vermogen</h1>

        <button
            class="instellingen-button"
            onclick="instellingenOpenen()"
            aria-label="Instellingen"
            title="Instellingen"
        >

            <svg
                class="instellingen-icoon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path
                    d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
                />

                <path
                    d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 1.7-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2.4v-.2a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 0 0 8.46 15a1.7 1.7 0 0 0-1.56-1.03H6.7v-2.4h.2A1.7 1.7 0 0 0 8.46 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.7-1.7.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 12.73 5.2V5h2.4v.2a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.7 1.7-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.56 1.03h.2v2.4h-.2A1.7 1.7 0 0 0 19.4 15Z"
                />

            </svg>

        </button>

    </div>


    <!-- TOTAAL VERMOGEN -->

    <section class="section total-card">

        <div class="total-label">
            Totaal vermogen
        </div>

        <div id="total-vermogen">
            € 0,00
        </div>

    </section>


    <!-- HISTORIE / GRAFIEK -->

    <section class="section">

        <h2>Vermogensontwikkeling</h2>

        <div class="periode-buttons">

            <button
                onclick="zetPeriode('3m')"
                id="btn-3m"
            >
                3 maanden
            </button>

            <button
                onclick="zetPeriode('1j')"
                id="btn-1j"
            >
                1 jaar
            </button>

            <button
                onclick="zetPeriode('alles')"
                id="btn-alles"
            >
                Alles
            </button>

        </div>


        <div
            id="groeiInfo"
            class="groei-info"
        ></div>


        <!-- GRAFIEK -->

        <div class="grafiek-container">

            <canvas
                id="vermogenGrafiek"
                height="250"
            ></canvas>


            <!-- TOOLTIP -->

            <div
                id="grafiekTooltip"
                class="grafiek-tooltip"
            >

                <div
                    id="tooltipDatum"
                    class="tooltip-datum"
                ></div>

                <div
                    id="tooltipBedrag"
                    class="tooltip-bedrag"
                ></div>

                <div
                    id="tooltipVerschil"
                    class="tooltip-verschil"
                ></div>

            </div>

        </div>


        <br>

        <button
            class="primary-button"
            onclick="vermogensMomentOpslaan()"
        >
            Vermogensmoment opslaan
        </button>

    </section>


    <!-- REKENINGEN -->

    <section class="section">

        <h2>Mijn rekeningen</h2>

        <div id="rekeningen"></div>

    </section>


    <!-- REKENING TOEVOEGEN -->

    <section class="section">

        <h2>Vermogen toevoegen</h2>

        <button
            class="primary-button"
            onclick="rekeningToevoegen()"
        >
            + Rekening toevoegen
        </button>

    </section>


    <!-- HISTORIE -->

    <section class="section">

        <h2>Historie</h2>

        <div id="historie"></div>

        <br>

        <button
            class="primary-button"
            onclick="historischMomentToevoegen()"
        >
            + Historisch vermogensmoment
        </button>

        <br><br>

        <button
            class="danger-button"
            onclick="historieWissen()"
        >
            Historie wissen
        </button>

    </section>

</div>


<script>


/*
 * ==========================================
 * DATA
 * ==========================================
 */

let rekeningen = JSON.parse(
    localStorage.getItem("mijnVermogenRekeningen")
) || [];

let historie = JSON.parse(
    localStorage.getItem("mijnVermogenHistorie")
) || [];

let huidigePeriode = "alles";

let grafiekGegevens = [];

let grafiekPunten = [];


/*
 * ==========================================
 * ACHTERGRONDKLEUR
 * ==========================================
 */

const standaardAchtergrond =
    "#C5DEDE";


let opgeslagenAchtergrond =
    localStorage.getItem(
        "mijnVermogenAchtergrond"
    ) || standaardAchtergrond;


function achtergrondInstellen(kleur) {

    document.documentElement.style
        .setProperty(
            "--app-background",
            kleur
        );

}


achtergrondInstellen(
    opgeslagenAchtergrond
);


/*
 * ==========================================
 * INSTELLINGEN OPENEN
 * ==========================================
 */

function instellingenOpenen() {

    const overlay =
        document.createElement("div");

    overlay.className =
        "instellingen-popup-overlay";


    const popup =
        document.createElement("div");

    popup.className =
        "instellingen-popup";


    const titel =
        document.createElement("div");

    titel.className =
        "instellingen-titel";

    titel.textContent =
        "Instellingen";


    const subtitel =
        document.createElement("div");

    subtitel.className =
        "instellingen-subtitel";

    subtitel.textContent =
        "Geef Mijn Vermogen jouw eigen uitstraling.";


    const label =
        document.createElement("div");

    label.className =
        "instellingen-label";

    label.textContent =
        "Achtergrondkleur";


    const kleurOpties =
        document.createElement("div");

    kleurOpties.className =
        "kleur-opties";


    const kleuren = [

        {
            naam: "Mint",
            kleur: "#C5DEDE"
        },

        {
            naam: "Blauw",
            kleur: "#C7D8E8"
        },

        {
            naam: "Lavendel",
            kleur: "#D8D0E8"
        }

    ];


    kleuren.forEach(
        function(item) {

            const optie =
                document.createElement("button");

            optie.className =
                "kleur-optie";

            optie.type =
                "button";


            if (
                item.kleur ===
                opgeslagenAchtergrond
            ) {

                optie.classList.add(
                    "active"
                );

            }


            const preview =
                document.createElement("div");

            preview.className =
                "kleur-preview";

            preview.style.background =
                item.kleur;


            const naam =
                document.createElement("div");

            naam.className =
                "kleur-naam";

            naam.textContent =
                item.naam;


            optie.appendChild(
                preview
            );

            optie.appendChild(
                naam
            );


            optie.onclick =
                function() {

                    opgeslagenAchtergrond =
                        item.kleur;


                    localStorage.setItem(
                        "mijnVermogenAchtergrond",
                        item.kleur
                    );


                    achtergrondInstellen(
                        item.kleur
                    );


                    document
                        .querySelectorAll(
                            ".kleur-optie"
                        )
                        .forEach(
                            function(knop) {

                                knop.classList
                                    .remove(
                                        "active"
                                    );

                            }
                        );


                    optie.classList.add(
                        "active"
                    );

                };


            kleurOpties.appendChild(
                optie
            );

        }
    );


    const sluitenButton =
        document.createElement("button");

    sluitenButton.className =
        "primary-button";

    sluitenButton.type =
        "button";

    sluitenButton.textContent =
        "Gereed";


    sluitenButton.onclick =
        function() {

            overlay.remove();

        };


    popup.appendChild(titel);

    popup.appendChild(subtitel);

    popup.appendChild(label);

    popup.appendChild(kleurOpties);

    popup.appendChild(
        sluitenButton
    );


    overlay.appendChild(
        popup
    );


    document.body.appendChild(
        overlay
    );


    overlay.onclick =
        function(event) {

            if (
                event.target === overlay
            ) {

                overlay.remove();

            }

        };

}


/*
 * ==========================================
 * OPSLAAN
 * ==========================================
 */

function slaRekeningenOp() {

    localStorage.setItem(
        "mijnVermogenRekeningen",
        JSON.stringify(rekeningen)
    );

}


function slaHistorieOp() {

    localStorage.setItem(
        "mijnVermogenHistorie",
        JSON.stringify(historie)
    );

}


/*
 * ==========================================
 * BEDRAG OPMAKEN
 * ==========================================
 */

function formatteerBedrag(bedrag) {

    return new Intl.NumberFormat(
        "nl-NL",
        {
            style: "currency",
            currency: "EUR"
        }
    ).format(bedrag);

}


/*
 * ==========================================
 * DATUM OPMAKEN
 * ==========================================
 */

function formatteerDatum(datum) {

    return new Date(datum).toLocaleDateString(
        "nl-NL",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/*
 * ==========================================
 * TOTAAL BEREKENEN
 * ==========================================
 */

function berekenTotaal() {

    let totaal = 0;

    rekeningen.forEach(function(rekening) {

        totaal += Number(rekening.bedrag) || 0;

    });

    document.getElementById(
        "total-vermogen"
    ).textContent = formatteerBedrag(totaal);

}


/*
 * ==========================================
 * REKENINGEN TONEN
 * ==========================================
 */

function toonRekeningen() {

    const container =
        document.getElementById("rekeningen");

    container.innerHTML = "";


    if (rekeningen.length === 0) {

        container.innerHTML =
            '<div class="leeg">Nog geen rekeningen toegevoegd.</div>';

        return;

    }


    rekeningen.forEach(function(rekening) {

        const div =
            document.createElement("div");

        div.className = "rekening";


        div.innerHTML = `

            <div class="rekening-info">

                <div class="rekening-naam">
                    ${rekening.naam}
                </div>

                <div class="rekening-type">
                    ${rekening.type}
                </div>

            </div>


            <div class="rekening-bedrag">
                ${formatteerBedrag(rekening.bedrag)}
            </div>


            <div class="rekening-acties">

                <button
                    onclick="rekeningBewerken(${rekening.id})"
                >
                    ✏️
                </button>

                <button
                    onclick="rekeningVerwijderen(${rekening.id})"
                >
                    🗑️
                </button>

            </div>

        `;


        container.appendChild(div);

    });

}


/*
 * ==========================================
 * REKENING TOEVOEGEN
 * ==========================================
 */

function rekeningToevoegen() {

    const overlay =
        document.createElement("div");

    overlay.className =
        "rekening-popup-overlay";


    const popup =
        document.createElement("div");

    popup.className =
        "rekening-popup";


    const titel =
        document.createElement("div");

    titel.className =
        "rekening-popup-titel";

    titel.textContent =
        "Rekening toevoegen";


    const subtitel =
        document.createElement("div");

    subtitel.className =
        "rekening-popup-subtitel";

    subtitel.textContent =
        "Vul de gegevens van je rekening in.";


    const naamGroep =
        document.createElement("div");

    naamGroep.className =
        "formulier-groep";


    const naamLabel =
        document.createElement("label");

    naamLabel.className =
        "formulier-label";

    naamLabel.textContent =
        "Naam rekening";


    const naamInput =
        document.createElement("input");

    naamInput.className =
        "formulier-input";

    naamInput.type =
        "text";

    naamInput.placeholder =
        "Bijvoorbeeld ING Spaarrekening";

    naamInput.autocomplete =
        "off";


    naamGroep.appendChild(naamLabel);

 */

function rekeningVerwijderen(id) {

    const rekening =
        rekeningen.find(function(item) {

            return item.id === id;

        });


    if (!rekening) {
        return;
    }


    const bevestigen = confirm(
        "Wil je " +
        rekening.naam +
        " verwijderen?"
    );


    if (!bevestigen) {
        return;
    }


    rekeningen =
        rekeningen.filter(function(item) {

            return item.id !== id;

        });


    slaRekeningenOp();

    toonRekeningen();

    berekenTotaal();

}


/*
 * ==========================================
 * VRAGEN OF VERMOGENSMOMENT OPGESLAGEN MOET WORDEN
 * ==========================================
 */

function vraagVermogensMomentOpslaan() {

    const totaal =
        rekeningen.reduce(
            function(som, rekening) {

                return som +
                    (Number(rekening.bedrag) || 0);

            },
            0
        );


    const bevestigen =
        confirm(
            "Je totale vermogen is nu " +
            formatteerBedrag(totaal) +
            ".\n\n" +
            "Wil je dit opslaan als nieuw vermogensmoment?"
        );


    if (!bevestigen) {
        return;
    }


    historie.push({

        datum:
            new Date().toISOString(),

        bedrag:
            totaal

    });


    historie.sort(
        function(a, b) {

            return (
                new Date(a.datum) -
                new Date(b.datum)
            );

        }
    );


    slaHistorieOp();

    toonHistorie();

    tekenGrafiek();

}


/*
 * ==========================================
 * VERMOGENSMOMENT OPSLAAN
 * ==========================================
 */

function vermogensMomentOpslaan() {

    let totaal = 0;


    rekeningen.forEach(function(rekening) {

        totaal +=
            Number(rekening.bedrag) || 0;

    });


    historie.push({

        datum:
            new Date().toISOString(),

        bedrag:
            totaal

    });


    slaHistorieOp();

    toonHistorie();

    tekenGrafiek();

}

/*
 * ==========================================
 * GROEI INFORMATIE
 * ==========================================
 */

function updateGroeiInfo(gegevens) {

    const element =
        document.getElementById(
            "groeiInfo"
        );


    if (
        !gegevens ||
        gegevens.length < 2
    ) {

        element.textContent =
            "Nog onvoldoende gegevens voor groei.";

        return;

    }


    const eerste =
        Number(gegevens[0].bedrag);


    const laatste =
        Number(
            gegevens[
                gegevens.length - 1
            ].bedrag
        );


    const verschil =
        laatste - eerste;


    const percentage =
        eerste !== 0
            ? (verschil / eerste) * 100
            : 0;


    const teken =
        verschil >= 0
            ? "+"
            : "";


    element.textContent =
        "Groei: " +
        teken +
        formatteerBedrag(verschil) +
        " (" +
        teken +
        percentage.toFixed(1) +
        "%)";

}


/*
 * ==========================================
 * TOOLTIP TONEN
 * ==========================================
 */

function toonGrafiekTooltip(
    puntIndex,
    x,
    y
) {

    const tooltip =
        document.getElementById(
            "grafiekTooltip"
        );


    const datumElement =
        document.getElementById(
            "tooltipDatum"
        );


    const bedragElement =
        document.getElementById(
            "tooltipBedrag"
        );


    const verschilElement =
        document.getElementById(
            "tooltipVerschil"
        );


    const punt =
        grafiekGegevens[puntIndex];


    if (!punt) {
        return;
    }


    datumElement.textContent =
        formatteerDatum(
            punt.datum
        );


    bedragElement.textContent =
        formatteerBedrag(
            punt.bedrag
        );


    /*
     * Verschil met vorige meetpunt
     */

    if (puntIndex === 0) {

        verschilElement.textContent =
            "Eerste vermogensmoment";

    } else {

        const vorige =
            Number(
                grafiekGegevens[
                    puntIndex - 1
                ].bedrag
            );


        const verschil =
            Number(punt.bedrag) -
            vorige;


        const teken =
            verschil >= 0
                ? "+"
                : "";


        verschilElement.textContent =
            "Sinds vorig moment: " +
            teken +
            formatteerBedrag(
                verschil
            );

    }


    /*
     * Tooltip binnen de grafiek houden
     */

    const container =
        document.querySelector(
            ".grafiek-container"
        );


    const containerBreedte =
        container.clientWidth;


    const tooltipBreedte =
        175;


    let tooltipX =
        x;


    const halveTooltip =
        tooltipBreedte / 2;


    if (
        tooltipX - halveTooltip < 5
    ) {

        tooltipX =
            halveTooltip + 5;

    }


    if (
        tooltipX + halveTooltip >
        containerBreedte - 5
    ) {

        tooltipX =
            containerBreedte -
            halveTooltip -
            5;

    }


    /*
     * Wanneer het punt bovenin zit,
     * tonen we de tooltip eronder.
     */

    const bovenkant =
        y < 85;


    tooltip.style.left =
        tooltipX + "px";


    if (bovenkant) {

        tooltip.style.top =
            (y + 18) + "px";

        tooltip.style.transform =
            "translate(-50%, 0)";

    } else {

        tooltip.style.top =
            y + "px";

        tooltip.style.transform =
            "translate(-50%, -100%) translateY(-12px)";

    }


    tooltip.classList.add(
        "visible"
    );

}


/*
 * ==========================================
 * TOOLTIP VERBERGEN
 * ==========================================
 */

function verbergGrafiekTooltip() {

    const tooltip =
        document.getElementById(
            "grafiekTooltip"
        );


    tooltip.classList.remove(
        "visible"
    );

}


/*
 * ==========================================
 * DICHTSTBIJZIJNDE GRAFIEKPUNT
 * ==========================================
 */

function vindDichtstbijzijndePunt(
    muisX,
    muisY
) {

    if (
        grafiekPunten.length === 0
    ) {

        return null;

    }


    let dichtstbijzijnde =
        null;

    let kleinsteAfstand =
        Infinity;


    grafiekPunten.forEach(
        function(punt, index) {

            const dx =
                muisX - punt.x;

            const dy =
                muisY - punt.y;


            const afstand =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                afstand <
                kleinsteAfstand
            ) {

                kleinsteAfstand =
                    afstand;

                dichtstbijzijnde = {

                    index: index,

                    x: punt.x,

                    y: punt.y

                };

            }

        }
    );


    /*
     * Alleen reageren wanneer de gebruiker
     * daadwerkelijk dicht bij een punt zit.
     */

    if (
        kleinsteAfstand > 28
    ) {

        return null;

    }


    return dichtstbijzijnde;

}


/*
 * ==========================================
 * MOUSE HOVER
 * ==========================================
 */

function grafiekMouseMove(event) {

    const canvas =
        document.getElementById(
            "vermogenGrafiek"
        );


    const rect =
        canvas.getBoundingClientRect();


    const schaalX =
        canvas.width /
        (window.devicePixelRatio || 1) /
        rect.width;


    const schaalY =
        canvas.height /
        (window.devicePixelRatio || 1) /
        rect.height;


    const x =
        (event.clientX - rect.left) *
        schaalX;


    const y =
        (event.clientY - rect.top) *
        schaalY;


    const punt =
        vindDichtstbijzijndePunt(
            x,
            y
        );


    if (!punt) {

        verbergGrafiekTooltip();

        return;

    }


    toonGrafiekTooltip(
        punt.index,
        punt.x,
        punt.y
    );

}


/*
 * ==========================================
 * MOUSE VERLATEN
 * ==========================================
 */

function grafiekMouseLeave() {

    verbergGrafiekTooltip();

}


/*
 * ==========================================
 * TIK OP GRAFIEK
 * ==========================================
 */

function grafiekTouch(event) {

    event.preventDefault();


    const touch =
        event.touches[0];


    if (!touch) {
        return;
    }


    const canvas =
        document.getElementById(
            "vermogenGrafiek"
        );


    const rect =
        canvas.getBoundingClientRect();


    const schaalX =
        canvas.width /
        (window.devicePixelRatio || 1) /
        rect.width;


    const schaalY =
        canvas.height /
        (window.devicePixelRatio || 1) /
        rect.height;


    const x =
        (touch.clientX - rect.left) *
        schaalX;


    const y =
        (touch.clientY - rect.top) *
        schaalY;


    const punt =
        vindDichtstbijzijndePunt(
            x,
            y
        );


    if (!punt) {

        verbergGrafiekTooltip();

        return;

    }


    toonGrafiekTooltip(
        punt.index,
        punt.x,
        punt.y
    );

}


/*
 * ==========================================
 * GRAFIEK TEKENEN
 * ==========================================
 */

function tekenGrafiek() {

    const canvas =
        document.getElementById(
            "vermogenGrafiek"
        );


    if (!canvas) {
        return;
    }


    const ctx =
        canvas.getContext("2d");


    const breedte =
        canvas.clientWidth;


    const hoogte =
        250;


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        breedte * dpr;


    canvas.height =
        hoogte * dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    ctx.clearRect(
        0,
        0,
        breedte,
        hoogte
    );


    let gegevens =
        [...historie];


    if (
        huidigePeriode === "3m"
    ) {

        const grens =
            new Date();


        grens.setMonth(
            grens.getMonth() - 3
        );


        gegevens =
            gegevens.filter(
                function(item) {

                    return (
                        new Date(item.datum) >=
                        grens
                    );

                }
            );

    }


    if (
        huidigePeriode === "1j"
    ) {

        const grens =
            new Date();


        grens.setFullYear(
            grens.getFullYear() - 1
        );


        gegevens =
            gegevens.filter(
                function(item) {

                    return (
                        new Date(item.datum) >=
                        grens
                    );

                }
            );

    }


    /*
     * Zorg dat de gegevens chronologisch
     * geordend zijn.
     */

    gegevens.sort(
        function(a, b) {

            return (
                new Date(a.datum) -
                new Date(b.datum)
            );

        }
    );


    grafiekGegevens =
        gegevens;


    grafiekPunten =
        [];


    updateGroeiInfo(
        gegevens
    );


    if (
        gegevens.length === 0
    ) {

        ctx.fillStyle =
            "#6b7280";


        ctx.font =
            "14px sans-serif";


        ctx.textAlign =
            "center";


        ctx.fillText(
            "Nog geen gegevens",
            breedte / 2,
            hoogte / 2
        );


        return;

    }


    const waarden =
        gegevens.map(
            function(item) {

                return Number(
                    item.bedrag
                );

            }
        );


    const minimum =
        Math.min(
            ...waarden
        );


    const maximum =
        Math.max(
            ...waarden
        );


    const marge =
        maximum === minimum
            ? 100
            : (
                maximum - minimum
            ) * 0.15;


    const minWaarde =
        minimum - marge;


    const maxWaarde =
        maximum + marge;


    const paddingLinks =
        10;


    const paddingRechts =
        10;


    const paddingBoven =
        20;


    const paddingOnder =
        25;


    const grafiekBreedte =
        breedte -
        paddingLinks -
        paddingRechts;


    const grafiekHoogte =
        hoogte -
        paddingBoven -
        paddingOnder;


    /*
     * ==========================================
     * GRAFIEKLIJN
     * ==========================================
     */

    ctx.beginPath();


    gegevens.forEach(
        function(item, index) {

            const x =
                paddingLinks +
                (
                    index /
                    Math.max(
                        gegevens.length - 1,
                        1
                    )
                ) *
                grafiekBreedte;


            const y =
                paddingBoven +
                (
                    1 -
                    (
                        (
                            Number(item.bedrag) -
                            minWaarde
                        ) /
                        (
                            maxWaarde -
                            minWaarde
                        )
                    )
                ) *
                grafiekHoogte;


            grafiekPunten.push({

                x: x,

                y: y

            });


            if (index === 0) {

                ctx.moveTo(
                    x,
                    y
                );

            } else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#111827";


    ctx.lineWidth =
        3;


    ctx.lineJoin =
        "round";


    ctx.lineCap =
        "round";


    ctx.stroke();


    /*
     * ==========================================
     * GRAFIEKPUNTEN
     * ==========================================
     */

    gegevens.forEach(
        function(item, index) {

            const punt =
                grafiekPunten[index];


            ctx.beginPath();


            ctx.arc(
                punt.x,
                punt.y,
                4,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "#111827";


            ctx.fill();

        }
    );

}


/*
 * ==========================================
 * GRAFIEK EVENTS
 * ==========================================
 */

const grafiekCanvas =
    document.getElementById(
        "vermogenGrafiek"
    );


grafiekCanvas.addEventListener(
    "mousemove",
    grafiekMouseMove
);


grafiekCanvas.addEventListener(
    "mouseleave",
    grafiekMouseLeave
);


grafiekCanvas.addEventListener(
    "touchstart",
    grafiekTouch,
    {
        passive: false
    }
);


/*
 * ==========================================
 * APP STARTEN
 * ==========================================
 */

toonRekeningen();

berekenTotaal();

toonHistorie();

zetPeriode("alles");


window.addEventListener(
    "resize",
    tekenGrafiek
);


</script>
