    <h1>Mijn Vermogen</h1>


    <!-- TOTAAL VERMOGEN -->

<script>


/*
 * ==========================================
 * DATA
 * ==========================================
 */

let rekeningen = JSON.parse(
    localStorage.getItem("mijnVermogenRekeningen")
) || [];

let historie = JSON.parse(
    localStorage.getItem("mijnVermogenHistorie")
) || [];

let huidigePeriode = "alles";


/*
 * ==========================================
 * OPSLAAN
 * ==========================================
 */

function slaRekeningenOp() {

    localStorage.setItem(
        "mijnVermogenRekeningen",
        JSON.stringify(rekeningen)
    );

}


function slaHistorieOp() {

    localStorage.setItem(
        "mijnVermogenHistorie",
        JSON.stringify(historie)
    );

}


/*
 * ==========================================
 * BEDRAG OPMAKEN
 * ==========================================
 */

function formatteerBedrag(bedrag) {

    return new Intl.NumberFormat(
        "nl-NL",
        {
            style: "currency",
            currency: "EUR"
        }
    ).format(bedrag);

}


/*
 * ==========================================
 * DATUM OPMAKEN
 * ==========================================
 */

function formatteerDatum(datum) {

    return new Date(datum).toLocaleDateString(
        "nl-NL",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/*
 * ==========================================
 * TOTAAL BEREKENEN
 * ==========================================
 */

function berekenTotaal() {

    let totaal = 0;

    rekeningen.forEach(function(rekening) {

        totaal += Number(rekening.bedrag) || 0;

    });

    document.getElementById(
        "total-vermogen"
    ).textContent = formatteerBedrag(totaal);

}


/*
 * ==========================================
 * REKENINGEN TONEN
 * ==========================================
 */

function toonRekeningen() {

    const container =
        document.getElementById("rekeningen");

    container.innerHTML = "";


    if (rekeningen.length === 0) {

        container.innerHTML =
            '<div class="leeg">Nog geen rekeningen toegevoegd.</div>';

        return;

    }


    rekeningen.forEach(function(rekening) {

        const div =
            document.createElement("div");

        div.className = "rekening";


        div.innerHTML = `

            <div class="rekening-info">

                <div class="rekening-naam">
                    ${rekening.naam}
                </div>

                <div class="rekening-type">
                    ${rekening.type}
                </div>

            </div>


            <div class="rekening-bedrag">
                ${formatteerBedrag(rekening.bedrag)}
            </div>


            <div class="rekening-acties">

                <button
                    onclick="rekeningBewerken(${rekening.id})"
                >
                    ✏️
                </button>

                <button
                    onclick="rekeningVerwijderen(${rekening.id})"
                >
                    🗑️
                </button>

            </div>

        `;


        container.appendChild(div);

    });

}


/*
 * ==========================================
 * REKENING TOEVOEGEN
 * ==========================================
 */

function rekeningToevoegen() {

    /*
     * Overlay maken
     */

    const overlay =
        document.createElement("div");

    overlay.className =
        "rekening-popup-overlay";


    /*
     * Popup maken
     */

    const popup =
        document.createElement("div");

    popup.className =
        "rekening-popup";


    /*
     * Titel
     */

    const titel =
        document.createElement("div");

    titel.className =
        "rekening-popup-titel";

    titel.textContent =
        "Rekening toevoegen";


    /*
     * Subtitel
     */

    const subtitel =
        document.createElement("div");

    subtitel.className =
        "rekening-popup-subtitel";

    subtitel.textContent =
        "Vul de gegevens van je rekening in.";


    /*
     * Naam
     */

    const naamGroep =
        document.createElement("div");

    naamGroep.className =
        "formulier-groep";


    const naamLabel =
        document.createElement("label");

    naamLabel.className =
        "formulier-label";

    naamLabel.textContent =
        "Naam rekening";


    const naamInput =
        document.createElement("input");

    naamInput.className =
        "formulier-input";

    naamInput.type =
        "text";

    naamInput.placeholder =
        "Bijvoorbeeld ING Spaarrekening";

    naamInput.autocomplete =
        "off";


    naamGroep.appendChild(naamLabel);

    naamGroep.appendChild(naamInput);


    /*
     * Type
     */

    const typeGroep =
        document.createElement("div");

    typeGroep.className =
        "formulier-groep";


    const typeLabel =
        document.createElement("label");

    typeLabel.className =
        "formulier-label";

    typeLabel.textContent =
        "Type rekening";


    const typeSelect =
        document.createElement("select");

    typeSelect.className =
        "formulier-select";


    typeSelect.innerHTML = `

        <option value="">
            Kies een type
        </option>

        <option value="Sparen">
            🏦 Sparen
        </option>

        <option value="Beleggen">
            📈 Beleggen
        </option>

        <option value="Betaalrekening">
            💳 Betaalrekening
        </option>

        <option value="Overig">
            📦 Overig
        </option>

    `;


    typeGroep.appendChild(typeLabel);

    typeGroep.appendChild(typeSelect);


    /*
     * Bedrag
     */

    const bedragGroep =
        document.createElement("div");

    bedragGroep.className =
        "formulier-groep";


    const bedragLabel =
        document.createElement("label");

    bedragLabel.className =
        "formulier-label";

    bedragLabel.textContent =
        "Huidig bedrag";


    const bedragInput =
        document.createElement("input");

    bedragInput.className =
        "formulier-input";

    bedragInput.type =
        "text";

    bedragInput.inputMode =
        "decimal";

    bedragInput.placeholder =
        "Bijvoorbeeld 12500,50";

    bedragInput.autocomplete =
        "off";


    bedragGroep.appendChild(bedragLabel);

    bedragGroep.appendChild(bedragInput);


    /*
     * Knoppen
     */

    const knoppen =
        document.createElement("div");

    knoppen.className =
        "popup-knoppen";


    const annulerenButton =
        document.createElement("button");

    annulerenButton.className =
        "secondary-button";

    annulerenButton.type =
        "button";

    annulerenButton.textContent =
        "Annuleren";


    const opslaanButton =
        document.createElement("button");

    opslaanButton.className =
        "primary-button";

    opslaanButton.type =
        "button";

    opslaanButton.textContent =
        "Opslaan";


    knoppen.appendChild(
        annulerenButton
    );

    knoppen.appendChild(
        opslaanButton
    );


    /*
     * Alles samenvoegen
     */

    popup.appendChild(titel);

    popup.appendChild(subtitel);

    popup.appendChild(naamGroep);

    popup.appendChild(typeGroep);

    popup.appendChild(bedragGroep);

    popup.appendChild(knoppen);

    overlay.appendChild(popup);

    document.body.appendChild(overlay);


    /*
     * Focus op naam
     */

    setTimeout(function() {

        naamInput.focus();

    }, 100);


    /*
     * Annuleren
     */

    annulerenButton.onclick = function() {

        overlay.remove();

    };


    /*
     * Opslaan
     */

    opslaanButton.onclick = function() {

        const naam =
            naamInput.value.trim();

        const type =
            typeSelect.value;

        const bedragInputWaarde =
            bedragInput.value.trim();


        /*
         * Naam controleren
         */

        if (!naam) {

            alert(
                "Vul een naam voor de rekening in."
            );

            naamInput.focus();

            return;

        }


        /*
         * Type controleren
         */

        if (!type) {

            alert(
                "Kies eerst een type rekening."
            );

            typeSelect.focus();

            return;

        }


        /*
         * Bedrag controleren
         */

        if (!bedragInputWaarde) {

            alert(
                "Vul een bedrag in."
            );

            bedragInput.focus();

            return;

        }


        const bedrag =
            parseFloat(
                bedragInputWaarde
                    .replace("€", "")
                    .replace(/\s/g, "")
                    .replace(/\./g, "")
                    .replace(",", ".")
            );


        if (isNaN(bedrag)) {

            alert(
                "Vul een geldig bedrag in."
            );

            bedragInput.focus();

            return;

        }


        /*
         * Rekening opslaan
         */

        rekeningen.push({

            id: Date.now(),

            naam: naam,

            type: type,

            bedrag: bedrag

        });


        slaRekeningenOp();

        toonRekeningen();

        berekenTotaal();


        /*
         * Popup sluiten
         */

        overlay.remove();

    };


    /*
     * Enter = opslaan
     */

    bedragInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                opslaanButton.click();

            }

        }
    );

}


/*
 * ==========================================
 * REKENING BEWERKEN
 * ==========================================
 */

function rekeningBewerken(id) {
    const rekening = rekeningen.find(function(item) {
        return item.id === id;
    });

    if (!rekening) {
        return;
    }

    const overlay = document.createElement("div");
    overlay.className = "rekening-popup-overlay";

    const popup = document.createElement("div");
    popup.className = "rekening-popup";

    const titel = document.createElement("div");
    titel.className = "rekening-popup-titel";
    titel.textContent = "Rekening bewerken";

    const subtitel = document.createElement("div");
    subtitel.className = "rekening-popup-subtitel";
    subtitel.textContent = "Pas de gegevens van je rekening aan.";

    /* Naam */
    const naamGroep = document.createElement("div");
    naamGroep.className = "formulier-groep";

    const naamLabel = document.createElement("label");
    naamLabel.className = "formulier-label";
    naamLabel.textContent = "Naam rekening";

    const naamInput = document.createElement("input");
    naamInput.className = "formulier-input";
    naamInput.type = "text";
    naamInput.value = rekening.naam;
    naamInput.autocomplete = "off";

    naamGroep.appendChild(naamLabel);
    naamGroep.appendChild(naamInput);

    /* Type */
    const typeGroep = document.createElement("div");
    typeGroep.className = "formulier-groep";

    const typeLabel = document.createElement("label");
    typeLabel.className = "formulier-label";
    typeLabel.textContent = "Type rekening";

    const typeSelect = document.createElement("select");
    typeSelect.className = "formulier-select";

    typeSelect.innerHTML = `
        <option value="Sparen">🏦 Sparen</option>
        <option value="Beleggen">📈 Beleggen</option>
        <option value="Betaalrekening">💳 Betaalrekening</option>
        <option value="Overig">📦 Overig</option>
    `;

    typeSelect.value = rekening.type;

    typeGroep.appendChild(typeLabel);
    typeGroep.appendChild(typeSelect);

    /* Bedrag */
    const bedragGroep = document.createElement("div");
    bedragGroep.className = "formulier-groep";

    const bedragLabel = document.createElement("label");
    bedragLabel.className = "formulier-label";
    bedragLabel.textContent = "Huidig bedrag";

    const bedragInput = document.createElement("input");
    bedragInput.className = "formulier-input";
    bedragInput.type = "text";
    bedragInput.inputMode = "decimal";
    bedragInput.value = rekening.bedrag.toString().replace(".", ",");
    bedragInput.autocomplete = "off";

    bedragGroep.appendChild(bedragLabel);
    bedragGroep.appendChild(bedragInput);

    /* Knoppen */
    const knoppen = document.createElement("div");
    knoppen.className = "popup-knoppen";

    const annulerenButton = document.createElement("button");
    annulerenButton.className = "secondary-button";
    annulerenButton.type = "button";
    annulerenButton.textContent = "Annuleren";

    const opslaanButton = document.createElement("button");
    opslaanButton.className = "primary-button";
    opslaanButton.type = "button";
    opslaanButton.textContent = "Opslaan";

    knoppen.appendChild(annulerenButton);
    knoppen.appendChild(opslaanButton);

    /* Popup opbouwen */
    popup.appendChild(titel);
    popup.appendChild(subtitel);
    popup.appendChild(naamGroep);
    popup.appendChild(typeGroep);
    popup.appendChild(bedragGroep);
    popup.appendChild(knoppen);

    overlay.appendChild(popup);
    document.body.appendChild(overlay);

    setTimeout(function() {
        naamInput.focus();
        naamInput.select();
    }, 100);

    /* Annuleren */
    annulerenButton.onclick = function() {
        overlay.remove();
    };

    /* Opslaan */
    opslaanButton.onclick = function() {
        const nieuweNaam = naamInput.value.trim();
        const nieuwType = typeSelect.value;
        const nieuwBedragInput = bedragInput.value.trim();

        if (!nieuweNaam) {
            alert("Vul een naam voor de rekening in.");
            naamInput.focus();
            return;
        }

        if (!nieuwType) {
            alert("Kies eerst een type rekening.");
            typeSelect.focus();
            return;
        }

        if (!nieuwBedragInput) {
            alert("Vul een bedrag in.");
            bedragInput.focus();
            return;
        }

        const nieuwBedrag = parseFloat(
            nieuwBedragInput
                .replace("€", "")
                .replace(/\s/g, "")
                .replace(/\./g, "")
                .replace(",", ".")
        );

        if (isNaN(nieuwBedrag)) {
            alert("Vul een geldig bedrag in.");
            bedragInput.focus();
            return;
        }

        rekening.naam = nieuweNaam;
        rekening.type = nieuwType;
        rekening.bedrag = nieuwBedrag;

        slaRekeningenOp();
        toonRekeningen();
        berekenTotaal();

        overlay.remove();
    };

    /* Enter = opslaan */
    bedragInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            opslaanButton.click();
        }
    });
}


/*
 * ==========================================
 * REKENING VERWIJDEREN
 * ==========================================
 */

function rekeningVerwijderen(id) {

    const rekening =
        rekeningen.find(function(item) {

            return item.id === id;

        });


    if (!rekening) {
        return;
    }


    const bevestigen = confirm(
        "Wil je " +
        rekening.naam +
        " verwijderen?"
    );


    if (!bevestigen) {
        return;
    }


    rekeningen =
        rekeningen.filter(function(item) {

            return item.id !== id;

        });


    slaRekeningenOp();

    toonRekeningen();

    berekenTotaal();

}


/*
 * ==========================================
 * VERMOGENSMOMENT OPSLAAN
 * ==========================================
 */

function vermogensMomentOpslaan() {

    let totaal = 0;


    rekeningen.forEach(function(rekening) {

        totaal += Number(rekening.bedrag) || 0;

    });


    historie.push({

        datum: new Date().toISOString(),

        bedrag: totaal

    });


    slaHistorieOp();

    toonHistorie();

    tekenGrafiek();

}


/*
 * ==========================================
 * HISTORIE TONEN
 * ==========================================
 */

function toonHistorie() {

    const container =
        document.getElementById("historie");

    container.innerHTML = "";


    if (historie.length === 0) {

        container.innerHTML =
            '<div class="leeg">Nog geen vermogensmomenten opgeslagen.</div>';

        return;

    }


    historie.forEach(function(moment, index) {

        const div =
            document.createElement("div");

        div.className =
            "historie-item";


        const datum =
            document.createElement("div");

        datum.className =
            "historie-datum";

        datum.textContent =
            formatteerDatum(moment.datum);


        const bedrag =
            document.createElement("div");

        bedrag.textContent =
            formatteerBedrag(moment.bedrag);


        const verwijderButton =
            document.createElement("button");

        verwijderButton.type =
            "button";

        verwijderButton.textContent =
            "🗑️";

        verwijderButton.title =
            "Dit vermogensmoment verwijderen";

        verwijderButton.setAttribute(
            "aria-label",
            "Vermogensmoment van " +
            formatteerDatum(moment.datum) +
            " verwijderen"
        );

        verwijderButton.style.border =
            "none";

        verwijderButton.style.borderRadius =
            "8px";

        verwijderButton.style.padding =
            "6px 10px";

        verwijderButton.style.background =
            "#f3f4f6";

        verwijderButton.style.cursor =
            "pointer";


        verwijderButton.onclick =
            function() {

                historischMomentVerwijderen(
                    index
                );

            };


        div.appendChild(datum);

        div.appendChild(bedrag);

        div.appendChild(
            verwijderButton
        );

        container.appendChild(div);

    });

}

 */

const vandaag =

vandaag.setHours(

);


if (datum > vandaag) {

    );

}


            /*

             */

            historie.push({

                bedrag:

            });

             * Historie chronologisch sorteren
             */

                        new Date(a.datum) -

                    );

                }
            );


            /*

             */

/*
 * ==========================================
 * ÉÉN HISTORISCH VERMOGENSMOMENT VERWIJDEREN
 * ==========================================
 */

function historischMomentVerwijderen(index) {

    const moment =
        historie[index];


    if (!moment) {
        return;
    }


    const bevestigen =
        confirm(
            "Wil je het vermogensmoment van " +
            formatteerDatum(moment.datum) +
            " (" +
            formatteerBedrag(moment.bedrag) +
            ") verwijderen?"
        );


    if (!bevestigen) {
        return;
    }


    historie.splice(
        index,
        1
    );


    slaHistorieOp();

    toonHistorie();

    tekenGrafiek();

}


/*
 * ==========================================
 * HISTORIE WISSEN
 * ==========================================
 */

function historieWissen() {

    if (historie.length === 0) {
        return;
    }


    const bevestigen =
        confirm(
            "Weet je zeker dat je alle historie wilt wissen?"
        );


    if (!bevestigen) {
        return;
    }


    historie = [];


    slaHistorieOp();

    toonHistorie();

    tekenGrafiek();

    updateGroeiInfo([]);

}


/*
 * ==========================================
 * PERIODE INSTELLEN
 * ==========================================
 */

function zetPeriode(periode) {

    huidigePeriode =
        periode;


    document
        .getElementById("btn-3m")
        .classList.remove("active");


    document
        .getElementById("btn-1j")
        .classList.remove("active");


    document
        .getElementById("btn-alles")
        .classList.remove("active");


    if (periode === "3m") {

        document
            .getElementById("btn-3m")
            .classList.add("active");

    }


    if (periode === "1j") {

        document
            .getElementById("btn-1j")
            .classList.add("active");

    }


    if (periode === "alles") {

        document
            .getElementById("btn-alles")
            .classList.add("active");

    }


    tekenGrafiek();

}


/*
 * ==========================================
 * GROEI INFORMATIE
 * ==========================================
 */

function updateGroeiInfo(gegevens) {

    const element =
        document.getElementById(
            "groeiInfo"
        );


    if (
        !gegevens ||
        gegevens.length < 2
    ) {

        element.textContent =
            "Nog onvoldoende gegevens voor groei.";

        return;

    }


    const eerste =
        gegevens[0].bedrag;


    const laatste =
        gegevens[
            gegevens.length - 1
        ].bedrag;


    const verschil =
        laatste - eerste;


    const percentage =
        eerste !== 0
            ? (verschil / eerste) * 100
            : 0;


    const teken =
        verschil >= 0
            ? "+"
            : "";


    element.textContent =
        "Groei: " +
        teken +
        formatteerBedrag(verschil) +
        " (" +
        teken +
        percentage.toFixed(1) +
        "%)";

}


/*
 * ==========================================
 * GRAFIEK TEKENEN
 * ==========================================
 */

function tekenGrafiek() {

    const canvas =
        document.getElementById(
            "vermogenGrafiek"
        );


    if (!canvas) {
        return;
    }


    const ctx =
        canvas.getContext("2d");


    const breedte =
        canvas.clientWidth;


    const hoogte =
        250;


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        breedte * dpr;


    canvas.height =
        hoogte * dpr;


    ctx.scale(
        dpr,
        dpr
    );


    ctx.clearRect(
        0,
        0,
        breedte,
        hoogte
    );


    let gegevens =
        [...historie];


    /*
     * Periode filteren
     */

    if (
        huidigePeriode === "3m"
    ) {

        const grens =
            new Date();


        grens.setMonth(
            grens.getMonth() - 3
        );


        gegevens =
            gegevens.filter(
                function(item) {

                    return (
                        new Date(item.datum) >=
                        grens
                    );

                }
            );

    }


    if (
        huidigePeriode === "1j"
    ) {

        const grens =
            new Date();


        grens.setFullYear(
            grens.getFullYear() - 1
        );


        gegevens =
            gegevens.filter(
                function(item) {

                    return (
                        new Date(item.datum) >=
                        grens
                    );

                }
            );

    }


    updateGroeiInfo(
        gegevens
    );


    if (
        gegevens.length === 0
    ) {

        ctx.fillStyle =
            "#6b7280";


        ctx.font =
            "14px sans-serif";


        ctx.textAlign =
            "center";


        ctx.fillText(
            "Nog geen gegevens",
            breedte / 2,
            hoogte / 2
        );


        return;

    }


    /*
     * Waarden bepalen
     */

    const waarden =
        gegevens.map(
            function(item) {

                return Number(
                    item.bedrag
                );

            }
        );


    const minimum =
        Math.min(
            ...waarden
        );


    const maximum =
        Math.max(
            ...waarden
        );


    const marge =
        maximum === minimum
            ? 100
            : (
                maximum - minimum
            ) * 0.15;


    const minWaarde =
        minimum - marge;


    const maxWaarde =
        maximum + marge;


    const paddingLinks =
        10;


    const paddingRechts =
        10;


    const paddingBoven =
        20;


    const paddingOnder =
        25;


    const grafiekBreedte =
        breedte -
        paddingLinks -
        paddingRechts;


    const grafiekHoogte =
        hoogte -
        paddingBoven -
        paddingOnder;


    /*
     * Lijn tekenen
     */

    ctx.beginPath();


    gegevens.forEach(
        function(item, index) {

            const x =
                paddingLinks +
                (
                    index /
                    Math.max(
                        gegevens.length - 1,
                        1
                    )
                ) *
                grafiekBreedte;


            const y =
                paddingBoven +
                (
                    1 -
                    (
                        (
                            item.bedrag -
                            minWaarde
                        ) /
                        (
                            maxWaarde -
                            minWaarde
                        )
                    )
                ) *
                grafiekHoogte;


            if (index === 0) {

                ctx.moveTo(
                    x,
                    y
                );

            } else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#111827";


    ctx.lineWidth =
        3;


    ctx.lineJoin =
        "round";


    ctx.lineCap =
        "round";


    ctx.stroke();


    /*
     * Punten tekenen
     */

    gegevens.forEach(
        function(item, index) {

            const x =
                paddingLinks +
                (
                    index /
                    Math.max(
                        gegevens.length - 1,
                        1
                    )
                ) *
                grafiekBreedte;


            const y =
                paddingBoven +
                (
                    1 -
                    (
                        (
                            item.bedrag -
                            minWaarde
                        ) /
                        (
                            maxWaarde -
                            minWaarde
                        )
                    )
                ) *
                grafiekHoogte;


            ctx.beginPath();


            ctx.arc(
                x,
                y,
                4,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "#111827";


            ctx.fill();

        }
    );

}

toonRekeningen();

zetPeriode("alles");

 */

window.addEventListener(
