<!DOCTYPE html>

<html lang="nl">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mijn Vermogen</title>

<style>

    :root {
        --app-background: #C5DEDE;
    }

    html {
        background: var(--app-background);
    }

    body {
        margin: 0;
        padding: 0;
        background: var(--app-background);
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        color: #111827;
        -webkit-font-smoothing: antialiased;
    }

    .container {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        padding:
            calc(20px + env(safe-area-inset-top))
            16px
            calc(30px + env(safe-area-inset-bottom))
            16px;
        box-sizing: border-box;
    }


    /*
     * ==========================================
     * TITEL + INSTELLINGEN
     * ==========================================
     */

    .header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 10px 0 25px;
    }

    h1 {
        margin: 0;
        font-size: 30px;
    }

    .instellingen-button {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);

        width: 42px;
        height: 42px;

        border: none;
        border-radius: 12px;

        background: rgba(255, 255, 255, 0.75);

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        transition:
            transform 0.15s ease,
            background 0.15s ease;
    }

    .instellingen-button:active {
        transform:
            translateY(-50%)
            scale(0.94);
    }

    .instellingen-button:hover {
        background: white;
    }

    .instellingen-icoon {
        width: 21px;
        height: 21px;

        fill: none;
        stroke: #111827;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    h2 {
        margin-top: 0;
        font-size: 20px;
    }

    .section {
        background: white;
        border-radius: 20px;
        padding: 20px;
        margin-bottom: 18px;
        box-shadow:
            0 4px 15px rgba(0, 0, 0, 0.06);
    }

    .total-card {
        text-align: center;
        padding: 25px 20px;
    }

    .total-label {
        font-size: 15px;
        color: #6b7280;
        margin-bottom: 8px;
    }

    #total-vermogen {
        font-size: 36px;
        font-weight: 700;
    }

    .groei-info {
        margin-top: 8px;
        margin-bottom: 12px;
        font-size: 14px;
        color: #6b7280;
    }

    .periode-buttons {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
    }

    .periode-buttons button {
        flex: 1;
        min-height: 42px;
        border: none;
        border-radius: 10px;
        background: #e5e7eb;
        color: #374151;
        font-size: 14px;
        cursor: pointer;
    }

    .periode-buttons button.active {
        background: #111827;
        color: white;
    }


    /*
     * ==========================================
     * GRAFIEK
     * ==========================================
     */

    .grafiek-wrapper {
        position: relative;
        width: 100%;
        height: 290px;
        touch-action: pan-y;
    }

    .grafiek-wrapper canvas {
        display: block;
        width: 100%;
        height: 290px;
        max-width: 100%;
        cursor: crosshair;
    }

    .grafiek-tooltip {
        position: absolute;
        z-index: 20;

        min-width: 150px;
        max-width: 210px;

        padding: 10px 12px;

        border-radius: 12px;

        background: rgba(17, 24, 39, 0.96);
        color: white;

        font-size: 13px;
        line-height: 1.35;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.18);

        pointer-events: none;

        opacity: 0;

        transform:
            translate(
                -50%,
                calc(-100% - 12px)
            );

        transition:
            opacity 0.12s ease;

        box-sizing: border-box;
    }

    .grafiek-tooltip.visible {
        opacity: 1;
    }

    .grafiek-tooltip.onder {
        transform:
            translate(
                -50%,
                12px
            );
    }

    .grafiek-tooltip-datum {
        color: #d1d5db;
        margin-bottom: 3px;
    }

    .grafiek-tooltip-bedrag {
        font-size: 16px;
        font-weight: 700;
    }

    .grafiek-tooltip-verschil {
        color: #d1d5db;
        margin-top: 3px;
    }


    /*
     * ==========================================
     * REKENINGEN
     * ==========================================
     */

    .rekening {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 15px 0;
        border-bottom: 1px solid #e5e7eb;
    }

    .rekening:last-child {
        border-bottom: none;
    }

    .rekening-info {
        flex: 1;
        min-width: 0;
    }

    .rekening-naam {
        font-weight: 600;
        font-size: 16px;
        margin-bottom: 4px;
    }

    .rekening-type {
        font-size: 13px;
        color: #6b7280;
    }

    .rekening-bedrag {
        font-weight: 700;
        white-space: nowrap;
    }

    .rekening-acties {
        display: flex;
        gap: 6px;
    }

    .rekening-acties button {
        border: none;
        border-radius: 8px;
        padding: 8px 10px;
        background: #f3f4f6;
        cursor: pointer;
    }

    .primary-button {
        width: 100%;
        min-height: 50px;
        border: none;
        border-radius: 12px;
        background: #111827;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .secondary-button {
        width: 100%;
        min-height: 45px;
        border: none;
        border-radius: 12px;
        background: #e5e7eb;
        color: #111827;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    .danger-button {
        width: 100%;
        min-height: 45px;
        border: none;
        border-radius: 12px;
        background: #fee2e2;
        color: #991b1b;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    .historie-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid #e5e7eb;
    }

    .historie-item:last-child {
        border-bottom: none;
    }

    .historie-datum {
        color: #6b7280;
        flex: 1;
    }

    .leeg {
        color: #6b7280;
        text-align: center;
        padding: 10px 0;
    }


    /*
     * ==========================================
     * INSTELLINGEN POPUP
     * ==========================================
     */

    .instellingen-popup-overlay {
        position: fixed;
        inset: 0;

        background: rgba(17, 24, 39, 0.45);

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;
        box-sizing: border-box;

        z-index: 10000;
    }

    .instellingen-popup {
        width: 100%;
        max-width: 380px;

        background: white;

        border-radius: 22px;

        padding: 24px;

        box-sizing: border-box;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .instellingen-titel {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .instellingen-subtitel {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 24px;
    }

    .instellingen-label {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
    }

    .kleur-opties {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
    }

    .kleur-optie {
        flex: 1;

        border: 2px solid transparent;

        border-radius: 14px;

        padding: 6px;

        background: #f3f4f6;

        cursor: pointer;

        transition:
            border-color 0.15s ease,
            transform 0.15s ease;
    }

    .kleur-optie:hover {
        transform: translateY(-2px);
    }

    .kleur-optie.active {
        border-color: #111827;
    }

    .kleur-preview {
        width: 100%;
        height: 55px;

        border-radius: 9px;

        margin-bottom: 7px;
    }

    .kleur-naam {
        font-size: 12px;
        font-weight: 600;
        text-align: center;
        color: #374151;
    }


    /*
     * ==========================================
     * REKENING POPUP
     * ==========================================
     */

    .rekening-popup-overlay {
        position: fixed;
        inset: 0;
        background: rgba(17, 24, 39, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
        z-index: 9999;
    }

    .rekening-popup {
        width: 100%;
        max-width: 430px;
        background: white;
        border-radius: 22px;
        padding: 24px;
        box-sizing: border-box;
        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .rekening-popup-titel {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .rekening-popup-subtitel {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 22px;
    }

    .formulier-label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 7px;
    }

    .formulier-groep {
        margin-bottom: 17px;
    }

    .formulier-input,
    .formulier-select {
        width: 100%;
        min-height: 48px;
        padding: 0 13px;
        box-sizing: border-box;
        border: 1px solid #d1d5db;
        border-radius: 11px;
        background: white;
        color: #111827;
        font-family: inherit;
        font-size: 16px;
        outline: none;
    }

    .formulier-input:focus,
    .formulier-select:focus {
        border-color: #111827;
    }

    .popup-knoppen {
        display: flex;
        gap: 10px;
        margin-top: 22px;
    }

    .popup-knoppen button {
        flex: 1;
    }

    @media (max-width: 380px) {

        .container {
            padding-left: 12px;
            padding-right: 12px;
        }

        #total-vermogen {
            font-size: 32px;
        }

        .section {
            padding: 17px;
        }

        .rekening-acties button {
            padding: 7px 8px;
        }

        .rekening-popup {
            padding: 20px;
        }

        .instellingen-popup {
            padding: 20px;
        }

    }

</style>


</head>

<body>

<div class="container">


<!-- TITEL + INSTELLINGEN -->

<div class="header">

    <h1>Mijn Vermogen</h1>

    <button
        class="instellingen-button"
        onclick="instellingenOpenen()"
        aria-label="Instellingen"
        title="Instellingen"
    >

        <svg
            class="instellingen-icoon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path
                d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
            />

            <path
                d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 1.7-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2.4v-.2a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 0 0 8.46 15a1.7 1.7 0 0 0-1.56-1.03H6.7v-2.4h.2A1.7 1.7 0 0 0 8.46 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.7-1.7.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 12.73 5.2V5h2.4v.2a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.7 1.7-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.56 1.03h.2v2.4h-.2A1.7 1.7 0 0 0 19.4 15Z"
            />

        </svg>

    </button>

</div>


<!-- TOTAAL VERMOGEN -->

<section class="section total-card">

    <div class="total-label">
        Totaal vermogen
    </div>

    <div id="total-vermogen">
        € 0,00
    </div>

</section>


<!-- HISTORIE / GRAFIEK -->

<section class="section">

    <h2>Vermogensontwikkeling</h2>

    <div class="periode-buttons">

        <button
            onclick="zetPeriode('3m')"
            id="btn-3m"
        >
            3 maanden
        </button>

        <button
            onclick="zetPeriode('1j')"
            id="btn-1j"
        >
            1 jaar
        </button>

        <button
            onclick="zetPeriode('alles')"
            id="btn-alles"
        >
            Alles
        </button>

    </div>

    <div
        id="groeiInfo"
        class="groei-info"
    ></div>


    <!-- GRAFIEK -->

    <div
        class="grafiek-wrapper"
        id="grafiekWrapper"
    >

        <canvas
            id="vermogenGrafiek"
            height="290"
        ></canvas>

        <div
            id="grafiekTooltip"
            class="grafiek-tooltip"
            aria-hidden="true"
        ></div>

    </div>


    <br>

    <button
        class="primary-button"
        onclick="vermogensMomentOpslaan()"
    >
        Vermogensmoment opslaan
    </button>

</section>


<!-- REKENINGEN -->

<section class="section">

    <h2>Mijn rekeningen</h2>

    <div id="rekeningen"></div>

</section>


<!-- REKENING TOEVOEGEN -->

<section class="section">

    <h2>Vermogen toevoegen</h2>

    <button
        class="primary-button"
        onclick="rekeningToevoegen()"
    >
        + Rekening toevoegen
    </button>

</section>


<!-- HISTORIE -->

<section class="section">

    <h2>Historie</h2>

    <div id="historie"></div>

    <br>

    <button
        class="primary-button"
        onclick="historischMomentToevoegen()"
    >
        + Historisch vermogensmoment
    </button>

    <br><br>

    <button
        class="danger-button"
        onclick="historieWissen()"
    >
        Historie wissen
    </button>

</section>


</div>

<script>


/*
 * ==========================================
 * DATA
 * ==========================================
 */

let rekeningen = JSON.parse(
    localStorage.getItem("mijnVermogenRekeningen")
) || [];

let historie = JSON.parse(
    localStorage.getItem("mijnVermogenHistorie")
) || [];

let huidigePeriode = "alles";


/*
 * Punten van de huidige grafiek.
 * Deze worden gebruikt voor hover en tik.
 */

let grafiekPunten = [];


/*
 * ==========================================
 * ACHTERGRONDKLEUR
 * ==========================================
 */

const standaardAchtergrond =
    "#C5DEDE";


let opgeslagenAchtergrond =
    localStorage.getItem(
        "mijnVermogenAchtergrond"
    ) || standaardAchtergrond;


function achtergrondInstellen(kleur) {

    document.documentElement.style
        .setProperty(
            "--app-background",
            kleur
        );

}


achtergrondInstellen(
    opgeslagenAchtergrond
);


/*
 * ==========================================
 * INSTELLINGEN OPENEN
 * ==========================================
 */

function instellingenOpenen() {

    const overlay =
        document.createElement("div");

    overlay.className =
        "instellingen-popup-overlay";


    const popup =
        document.createElement("div");

    popup.className =
        "instellingen-popup";


    const titel =
        document.createElement("div");

    titel.className =
        "instellingen-titel";

    titel.textContent =
        "Instellingen";


    const subtitel =
        document.createElement("div");

    subtitel.className =
        "instellingen-subtitel";

    subtitel.textContent =
        "Geef Mijn Vermogen jouw eigen uitstraling.";


    const label =
        document.createElement("div");

    label.className =
        "instellingen-label";

    label.textContent =
        "Achtergrondkleur";


    const kleurOpties =
        document.createElement("div");

    kleurOpties.className =
        "kleur-opties";


    const kleuren = [

        {
            naam: "Mint",
            kleur: "#C5DEDE"
        },

        {
            naam: "Blauw",
            kleur: "#C7D8E8"
        },

        {
            naam: "Lavendel",
            kleur: "#D8D0E8"
        }

    ];


    kleuren.forEach(
        function(item) {

            const optie =
                document.createElement("button");

            optie.className =
                "kleur-optie";

            optie.type =
                "button";


            if (
                item.kleur ===
                opgeslagenAchtergrond
            ) {

                optie.classList.add(
                    "active"
                );

            }


            const preview =
                document.createElement("div");

            preview.className =
                "kleur-preview";

            preview.style.background =
                item.kleur;


            const naam =
                document.createElement("div");

            naam.className =
                "kleur-naam";

            naam.textContent =
                item.naam;


            optie.appendChild(
                preview
            );

            optie.appendChild(
                naam
            );


            optie.onclick =
                function() {

                    opgeslagenAchtergrond =
                        item.kleur;


                    localStorage.setItem(
                        "mijnVermogenAchtergrond",
                        item.kleur
                    );


                    achtergrondInstellen(
                        item.kleur
                    );


                    document
                        .querySelectorAll(
                            ".kleur-optie"
                        )
                        .forEach(
                            function(knop) {

                                knop.classList
                                    .remove(
                                        "active"
                                    );

                            }
                        );


                    optie.classList.add(
                        "active"
                    );

                };


            kleurOpties.appendChild(
                optie
            );

        }
    );


    const sluitenButton =
        document.createElement("button");

    sluitenButton.className =
        "primary-button";

    sluitenButton.type =
        "button";

    sluitenButton.textContent =
        "Gereed";


    sluitenButton.onclick =
        function() {

            overlay.remove();

        };


    popup.appendChild(titel);

    popup.appendChild(subtitel);

    popup.appendChild(label);

    popup.appendChild(kleurOpties);

    popup.appendChild(
        sluitenButton
    );


    overlay.appendChild(
        popup
    );


    document.body.appendChild(
        overlay
    );


    overlay.onclick =
        function(event) {

            if (
                event.target === overlay
            ) {

                overlay.remove();

            }

        };

}


/*
 * ==========================================
 * OPSLAAN
 * ==========================================
 */

function slaRekeningenOp() {

    localStorage.setItem(
        "mijnVermogenRekeningen",
        JSON.stringify(rekeningen)
    );

}


function slaHistorieOp() {

    localStorage.setItem(
        "mijnVermogenHistorie",
        JSON.stringify(historie)
    );

}


/*
 * ==========================================
 * BEDRAG OPMAKEN
 * ==========================================
 */

function formatteerBedrag(bedrag) {

    return new Intl.NumberFormat(
        "nl-NL",
        {
            style: "currency",
            currency: "EUR"
        }
    ).format(bedrag);

}


/*
 * ==========================================
 * DATUM OPMAKEN
 * ==========================================
 */

function formatteerDatum(datum) {

    return new Date(datum).toLocaleDateString(
        "nl-NL",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/*
 * ==========================================
 * TOTAAL BEREKENEN
 * ==========================================
 */

function berekenTotaal() {

    let totaal = 0;

    rekeningen.forEach(function(rekening) {

        totaal += Number(rekening.bedrag) || 0;

    });

    document.getElementById(
        "total-vermogen"
    ).textContent = formatteerBedrag(totaal);

}


/*
 * ==========================================
 * REKENINGEN TONEN
 * ==========================================
 */

function toonRekeningen() {

    const container =
        document.getElementById("rekeningen");

    container.innerHTML = "";


    if (rekeningen.length === 0) {

        container.innerHTML =
            '<div class="leeg">Nog geen rekeningen toegevoegd.</div>';

        return;

    }


    rekeningen.forEach(function(rekening) {

        const div =
            document.createElement("div");

        div.className = "rekening";


        div.innerHTML = `

            <div class="rekening-info">

                <div class="rekening-naam">
                    ${rekening.naam}
                </div>

                <div class="rekening-type">
                    ${rekening.type}
                </div>

            </div>


            <div class="rekening-bedrag">
                ${formatteerBedrag(rekening.bedrag)}
            </div>


            <div class="rekening-acties">

                <button
                    onclick="rekeningBewerken(${rekening.id})"
                >
                    ✏️
                </button>

                <button
                    onclick="rekeningVerwijderen(${rekening.id})"
                >
                    🗑️
                </button>

            </div>

        `;


        container.appendChild(div);

    });

}


/*
 * ==========================================
 * REKENING TOEVOEGEN
 * ==========================================
 */

function rekeningToevoegen() {

    const overlay =
        document.createElement("div");

    overlay.className =
        "rekening-popup-overlay";


    const popup =
        document.createElement("div");

    popup.className =
        "rekening-popup";


    const titel =
        document.createElement("div");

    titel.className =
        "rekening-popup-titel";

    titel.textContent =
        "Rekening toevoegen";


    const subtitel =
        document.createElement("div");

    subtitel.className =
        "rekening-popup-subtitel";

    subtitel.textContent =
        "Vul de gegevens van je rekening in.";


    const naamGroep =
        document.createElement("div");

    naamGroep.className =
        "formulier-groep";


    const naamLabel =
        document.createElement("label");

    naamLabel.className =
        "formulier-label";

    naamLabel.textContent =
        "Naam rekening";


    const naamInput =
        document.createElement("input");

    naamInput.className =
        "formulier-input";

    naamInput.type =
        "text";

    naamInput.placeholder =
        "Bijvoorbeeld ING Spaarrekening";

    naamInput.autocomplete =
        "off";


    naamGroep.appendChild(naamLabel);

    naamGroep.appendChild(naamInput);


    const typeGroep =
        document.createElement("div");

    typeGroep.className =
        "formulier-groep";


    const typeLabel =
        document.createElement("label");

    typeLabel.className =
        "formulier-label";

    typeLabel.textContent =
        "Type rekening";


    const typeSelect =
        document.createElement("select");

function rekeningVerwijderen(id) {

    const rekening =
        rekeningen.find(function(item) {

            return item.id === id;

        });


    if (!rekening) {
        return;
    }


    const bevestigen = confirm(
        "Wil je " +
        rekening.naam +
        " verwijderen?"
    );


    if (!bevestigen) {
        return;
    }


    rekeningen =
        rekeningen.filter(function(item) {

            return item.id !== id;

        });


    slaRekeningenOp();

    toonRekeningen();

    berekenTotaal();

}


/*
 * ==========================================
 * VRAGEN OF VERMOGENSMOMENT OPGESLAGEN MOET WORDEN
 * ==========================================
 */

function vraagVermogensMomentOpslaan() {

    const totaal =
        rekeningen.reduce(
            function(som, rekening) {

                return som +
                    (Number(rekening.bedrag) || 0);

            },
            0
        );


    const bevestigen =
        confirm(
            "Je totale vermogen is nu " +
            formatteerBedrag(totaal) +
            ".\n\n" +
            "Wil je dit opslaan als nieuw vermogensmoment?"
        );


    if (!bevestigen) {
        return;
    }


    historie.push({

        datum:
            new Date().toISOString(),

        bedrag:
            totaal

    });


    historie.sort(
        function(a, b) {

            return (
                new Date(a.datum) -
                new Date(b.datum)
            );

        }
    );


    slaHistorieOp();

    toonHistorie();

    tekenGrafiek();

}


/*
 * ==========================================
 * VERMOGENSMOMENT OPSLAAN
 * ==========================================
 */

function vermogensMomentOpslaan() {

    let totaal = 0;


    rekeningen.forEach(function(rekening) {

        totaal +=
            Number(rekening.bedrag) || 0;

    });


    historie.push({

        datum:
            new Date().toISOString(),

        bedrag:
            totaal

    });


    slaHistorieOp();

    toonHistorie();

    tekenGrafiek();

}

/*
 * ==========================================
 * GROEI INFORMATIE
 * ==========================================
 */

function updateGroeiInfo(gegevens) {

    const element =
        document.getElementById(
            "groeiInfo"
        );


    if (
        !gegevens ||
        gegevens.length < 2
    ) {

        element.textContent =
            "Nog onvoldoende gegevens voor groei.";

        return;

    }


    const eerste =
        Number(
            gegevens[0].bedrag
        );


    const laatste =
        Number(
            gegevens[
                gegevens.length - 1
            ].bedrag
        );


    const verschil =
        laatste - eerste;


    const percentage =
        eerste !== 0
            ? (verschil / eerste) * 100
            : 0;


    const teken =
        verschil >= 0
            ? "+"
            : "";


    element.textContent =
        "Groei: " +
        teken +
        formatteerBedrag(verschil) +
        " (" +
        teken +
        percentage.toFixed(1) +
        "%)";

}

 * GRAFIEK TOOLTIP
 * ==========================================
 */

function verbergGrafiekTooltip() {

    const tooltip =
        document.getElementById(
            "grafiekTooltip"
        );


    if (!tooltip) {
        return;
    }


    tooltip.classList.remove(
        "visible"
    );

    tooltip.classList.remove(
        "onder"
    );

    tooltip.setAttribute(
        "aria-hidden",
        "true"
    );

}


function toonGrafiekTooltip(punt) {

    const tooltip =
        document.getElementById(
            "grafiekTooltip"
        );


    const wrapper =
        document.getElementById(
            "grafiekWrapper"
        );


    if (
        !tooltip ||
        !wrapper ||
        !punt
    ) {

        return;

    }


    const vorigePunt =
        punt.index > 0
            ? grafiekPunten[
                punt.index - 1
            ]
            : null;


    let verschil =
        null;


    if (vorigePunt) {

        verschil =
            Number(punt.item.bedrag) -
            Number(
                vorigePunt.item.bedrag
            );

    }


    const teken =
        verschil !== null &&
        verschil >= 0
            ? "+"
            : "";


    tooltip.innerHTML = `

        <div class="grafiek-tooltip-datum">
            ${formatteerDatum(punt.item.datum)}
        </div>

        <div class="grafiek-tooltip-bedrag">
            ${formatteerBedrag(punt.item.bedrag)}
        </div>

        ${
            verschil !== null
                ? `
                    <div class="grafiek-tooltip-verschil">
                        ${teken}${formatteerBedrag(verschil)}
                        t.o.v. vorig meetpunt
                    </div>
                  `
                : ""
        }

    `;


    /*
     * Tooltip niet buiten de grafiek laten vallen.
     */

    const tooltipBreedte =
        tooltip.offsetWidth || 180;


    const helft =
        tooltipBreedte / 2;


    const breedte =
        wrapper.clientWidth;


    let tooltipX =
        punt.x;


    tooltipX =
        Math.max(
            helft + 4,
            Math.min(
                breedte - helft - 4,
                tooltipX
            )
        );


    tooltip.style.left =
        tooltipX + "px";


    tooltip.style.top =
        punt.y + "px";


    tooltip.classList.remove(
        "onder"
    );


    if (punt.y < 80) {

        tooltip.classList.add(
            "onder"
        );

    }


    tooltip.classList.add(
        "visible"
    );


    tooltip.setAttribute(
        "aria-hidden",
        "false"
    );

}

    const canvas =
        document.getElementById(
            "vermogenGrafiek"
        );


    if (
        !canvas ||
        grafiekPunten.length === 0
    ) {

        return null;

    }


    const rect =
        canvas.getBoundingClientRect();


    const x =
        event.clientX -
        rect.left;


    const y =
        event.clientY -
        rect.top;


    let bestePunt =
        null;


    let besteAfstand =
        Infinity;


    grafiekPunten.forEach(
        function(punt) {

            const dx =
                punt.x - x;


            const dy =
                punt.y - y;


            const afstand =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                afstand <
                besteAfstand
            ) {

                besteAfstand =
                    afstand;

                bestePunt =
                    punt;

            }

        }
    );


    /*
     * Alleen reageren als je redelijk
     * dicht bij een meetpunt zit.
     */

    if (
        besteAfstand <= 45
    ) {

        return bestePunt;

    }


    return null;

}


/*
 * ==========================================
 * TIJDAS LABELS
 * ==========================================
 */

function maakTijdAsLabels(
    ctx,
    minDatum,
    maxDatum,
    xStart,
    xEinde,
    y
) {

    const verschilMs =
        maxDatum - minDatum;


    if (verschilMs <= 0) {

        return;

    }


    const dagen =
        verschilMs /
        (
            1000 *
            60 *
            60 *
            24
        );


    let aantalLabels;


    if (dagen <= 45) {

        aantalLabels = 4;

    } else if (dagen <= 120) {

        aantalLabels = 5;

    } else if (dagen <= 400) {

        aantalLabels = 5;

    } else {

        aantalLabels = 5;

    }


    /*
     * Voor een korte periode gebruiken we
     * dagen/weken.
     *
     * Voor langere periodes gebruiken we
     * maanden.
     */

    const datums = [];


    if (dagen <= 45) {

        const stap =
            verschilMs /
            (aantalLabels - 1);


        for (
            let i = 0;
            i < aantalLabels;
            i++
        ) {

            datums.push(
                new Date(
                    minDatum.getTime() +
                    stap * i
                )
            );

        }

    } else {

        const eerste =
            new Date(minDatum);


        eerste.setDate(1);


        /*
         * Als het eerste label voor de
         * gekozen periode ligt, schuiven
         * we het door naar de volgende maand.
         */

        if (
            eerste <
            minDatum
        ) {

            eerste.setMonth(
                eerste.getMonth() + 1
            );

        }


        const laatste =
            new Date(maxDatum);


        laatste.setDate(1);


        const beschikbareMaanden =
            (
                laatste.getFullYear() -
                eerste.getFullYear()
            ) * 12 +
            (
                laatste.getMonth() -
                eerste.getMonth()
            ) +
            1;


        if (
            beschikbareMaanden <=
            aantalLabels
        ) {

            for (
                let datum = new Date(eerste);
                datum <= laatste;
                datum.setMonth(
                    datum.getMonth() + 1
                )
            ) {

                datums.push(
                    new Date(datum)
                );

            }

        } else {

            const maandStap =
                Math.ceil(
                    (
                        beschikbareMaanden - 1
                    ) /
                    (
                        aantalLabels - 1
                    )
                );


            for (
                let i = 0;
                i < aantalLabels;
                i++
            ) {

                const datum =
                    new Date(eerste);


                datum.setMonth(
                    datum.getMonth() +
                    (
                        i *
                        maandStap
                    )
                );


                if (
                    datum <=
                    laatste
                ) {

                    datums.push(
                        datum
                    );

                }

            }

        }

    }


    /*
     * Labels tekenen.
     */

    ctx.save();


    ctx.fillStyle =
        "#6b7280";


    ctx.strokeStyle =
        "#e5e7eb";


    ctx.lineWidth =
        1;


    ctx.font =
        "11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "top";


    datums.forEach(
        function(datum) {

            const verhouding =
                (
                    datum -
                    minDatum
                ) /
                verschilMs;


            const x =
                xStart +
                (
                    verhouding *
                    (
                        xEinde -
                        xStart
                    )
                );


            /*
             * Verticale hulplijn.
             */

            ctx.beginPath();

            ctx.moveTo(
                x,
                y - 5
            );

            ctx.lineTo(
                x,
                y + 1
            );

            ctx.stroke();


            let label;


            if (dagen <= 45) {

                label =
                    datum.toLocaleDateString(
                        "nl-NL",
                        {
                            day: "numeric",
                            month: "short"
                        }
                    );

            } else {

                label =
                    datum.toLocaleDateString(
                        "nl-NL",
                        {
                            month: "short",
                            year: "numeric"
                        }
                    );

            }


            ctx.fillText(
                label,
                x,
                y + 7
            );

        }
    );


    ctx.restore();

}


/*
 * ==========================================
 * GRAFIEK TEKENEN
 * ==========================================
 */

function tekenGrafiek() {

    const canvas =
        document.getElementById(
            "vermogenGrafiek"
        );


    if (!canvas) {
        return;
    }


    const wrapper =
        document.getElementById(
            "grafiekWrapper"
        );


    const ctx =
        canvas.getContext("2d");


    const breedte =
        canvas.clientWidth;


    const hoogte =
        290;


    if (
        breedte <= 0
    ) {

        return;

    }


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        breedte * dpr;


    canvas.height =
        hoogte * dpr;


    ctx.scale(
        dpr,
        dpr
    );


    ctx.clearRect(
        0,
        0,
        breedte,
        hoogte
    );


    grafiekPunten = [];


    verbergGrafiekTooltip();


    let gegevens =
        [...historie];


    /*
     * Altijd chronologisch sorteren.
     */

    gegevens.sort(
        function(a, b) {

            return (
                new Date(a.datum) -
                new Date(b.datum)
            );

        }
    );


    /*
     * Periode filteren.
     */

    if (
        huidigePeriode === "3m"
    ) {

        const grens =
            new Date();


        grens.setMonth(
            grens.getMonth() - 3
        );


        gegevens =
            gegevens.filter(
                function(item) {

                    return (
                        new Date(item.datum) >=
                        grens
                    );

                }
            );

    }


    if (
        huidigePeriode === "1j"
    ) {

        const grens =
            new Date();


        grens.setFullYear(
            grens.getFullYear() - 1
        );


        gegevens =
            gegevens.filter(
                function(item) {

                    return (
                        new Date(item.datum) >=
                        grens
                    );

                }
            );

    }


    updateGroeiInfo(
        gegevens
    );


    if (
        gegevens.length === 0
    ) {

        ctx.fillStyle =
            "#6b7280";


        ctx.font =
            "14px sans-serif";


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.fillText(
            "Nog geen gegevens",
            breedte / 2,
            120
        );


        return;

    }


    /*
     * ==========================================
     * GRAFIEK BEREKENEN
     * ==========================================
     */

    const waarden =
        gegevens.map(
            function(item) {

                return Number(
                    item.bedrag
                );

            }
        );


    const minimum =
        Math.min(
            ...waarden
        );


    const maximum =
        Math.max(
            ...waarden
        );


    const marge =
        maximum === minimum
            ? Math.max(
                100,
                Math.abs(maximum) * 0.05
            )
            : (
                maximum - minimum
            ) * 0.15;


    const minWaarde =
        minimum - marge;


    const maxWaarde =
        maximum + marge;


    /*
     * Extra ruimte links/rechts zodat
     * de eerste en laatste punten niet
     * tegen de rand staan.
     */

    const paddingLinks =
        12;


    const paddingRechts =
        12;


    const paddingBoven =
        20;


    const paddingOnder =
        55;


    const grafiekBreedte =
        breedte -
        paddingLinks -
        paddingRechts;


    const grafiekHoogte =
        hoogte -
        paddingBoven -
        paddingOnder;


    /*
     * ==========================================
     * ECHTE TIJDSCHAAL
     * ==========================================
     */

    let minDatum =
        new Date(
            gegevens[0].datum
        );


    let maxDatum =
        new Date(
            gegevens[
                gegevens.length - 1
            ].datum
        );


    /*
     * Als er maar één meetpunt is,
     * maken we een kleine tijdspanne.
     */

    if (
        minDatum.getTime() ===
        maxDatum.getTime()
    ) {

        minDatum =
            new Date(
                minDatum.getTime() -
                7 *
                24 *
                60 *
                60 *
                1000
            );


        maxDatum =
            new Date(
                maxDatum.getTime() +
                7 *
                24 *
                60 *
                60 *
                1000
            );

    }


    const tijdsduur =
        maxDatum -
        minDatum;


    /*
     * ==========================================
     * HULPLIJNEN
     * ==========================================
     */

    ctx.save();


    ctx.strokeStyle =
        "#f0f1f3";


    ctx.lineWidth =
        1;


    /*
     * Een paar horizontale hulplijnen.
     */

    const aantalHorizontaleLijnen =
        4;


    for (
        let i = 0;
        i <= aantalHorizontaleLijnen;
        i++
    ) {

        const y =
            paddingBoven +
            (
                i /
                aantalHorizontaleLijnen
            ) *
            grafiekHoogte;


        ctx.beginPath();


        ctx.moveTo(
            paddingLinks,
            y
        );


        ctx.lineTo(
            breedte -
            paddingRechts,
            y
        );


        ctx.stroke();

    }


    ctx.restore();


    /*
     * ==========================================
     * LIJN TEKENEN
     * ==========================================
     */

    ctx.beginPath();


    gegevens.forEach(
        function(item, index) {

            const datum =
                new Date(
                    item.datum
                );


            const tijdVerhouding =
                (
                    datum -
                    minDatum
                ) /
                tijdsduur;


            const x =
                paddingLinks +
                (
                    tijdVerhouding *
                    grafiekBreedte
                );


            const waarde =
                Number(
                    item.bedrag
                );


            const waardeVerhouding =
                (
                    waarde -
                    minWaarde
                ) /
                (
                    maxWaarde -
                    minWaarde
                );


            const y =
                paddingBoven +
                (
                    1 -
                    waardeVerhouding
                ) *
                grafiekHoogte;


            grafiekPunten.push({

                x: x,

                y: y,

                item: item,

                index: index

            });


            if (
                index === 0
            ) {

                ctx.moveTo(
                    x,
                    y
                );

            } else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#111827";


    ctx.lineWidth =
        3;


    ctx.lineJoin =
        "round";


    ctx.lineCap =
        "round";


    ctx.stroke();


    /*
     * ==========================================
     * MEETPUNTEN
     * ==========================================
     */

    grafiekPunten.forEach(
        function(punt) {

            ctx.beginPath();


            ctx.arc(
                punt.x,
                punt.y,
                4,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "#111827";


            ctx.fill();

        }
    );


    /*
     * ==========================================
     * TIJDAS
     * ==========================================
     */

    maakTijdAsLabels(
        ctx,
        minDatum,
        maxDatum,
        paddingLinks,
        breedte - paddingRechts,
        paddingBoven +
        grafiekHoogte
    );


}


/*
 * ==========================================
 * GRAFIEK INTERACTIE
 * ==========================================
 */

const grafiekCanvas =
    document.getElementById(
        "vermogenGrafiek"
    );


if (grafiekCanvas) {

    /*
     * Desktop: hover.
     */

    grafiekCanvas.addEventListener(
        "mousemove",
        function(event) {

            const punt =
                vindDichtstbijzijndePunt(
                    event
                );


            if (punt) {

                toonGrafiekTooltip(
                    punt
                );

            } else {

                verbergGrafiekTooltip();

            }

        }
    );


    grafiekCanvas.addEventListener(
        "mouseleave",
        function() {

            verbergGrafiekTooltip();

        }
    );


    /*
     * Mobiel: tik op een meetpunt.
     */

    grafiekCanvas.addEventListener(
        "click",
        function(event) {

            const punt =
                vindDichtstbijzijndePunt(
                    event
                );


            if (punt) {

                toonGrafiekTooltip(
                    punt
                );

            } else {

                verbergGrafiekTooltip();

            }

        }
    );

}


/*
 * ==========================================
 * APP STARTEN
 * ==========================================
 */

toonRekeningen();

berekenTotaal();

toonHistorie();

zetPeriode("alles");


window.addEventListener(
    "resize",
    tekenGrafiek
);


</script>
