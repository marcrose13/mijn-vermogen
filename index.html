<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mijn Vermogen</title>

    <style>

        html {
            background: #C5DEDE;
        }

        body {
            margin: 0;
            padding: 0;
            background: #C5DEDE;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: #111827;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding:
                calc(20px + env(safe-area-inset-top))
                16px
                calc(30px + env(safe-area-inset-bottom))
                16px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin: 10px 0 25px;
            font-size: 30px;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .total-card {
            text-align: center;
            padding: 25px 20px;
        }

        .total-label {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        #total-vermogen {
            font-size: 36px;
            font-weight: 700;
        }

        .groei-info {
            margin-top: 8px;
            font-size: 14px;
            color: #6b7280;
        }

        .periode-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .periode-buttons button {
            flex: 1;
            min-height: 42px;
            border: none;
            border-radius: 10px;
            background: #e5e7eb;
            color: #374151;
            font-size: 14px;
            cursor: pointer;
        }

        .periode-buttons button.active {
            background: #111827;
            color: white;
        }

        canvas {
            width: 100%;
            max-width: 100%;
        }

        .rekening {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .rekening:last-child {
            border-bottom: none;
        }

        .rekening-info {
            flex: 1;
            min-width: 0;
        }

        .rekening-naam {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .rekening-type {
            font-size: 13px;
            color: #6b7280;
        }

        .rekening-bedrag {
            font-weight: 700;
            white-space: nowrap;
        }

        .rekening-acties {
            display: flex;
            gap: 6px;
        }

        .rekening-acties button {
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            background: #f3f4f6;
            cursor: pointer;
        }

        .primary-button {
            width: 100%;
            min-height: 50px;
            border: none;
            border-radius: 12px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .secondary-button {
            width: 100%;
            min-height: 45px;
            border: none;
            border-radius: 12px;
            background: #e5e7eb;
            color: #111827;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .danger-button {
            width: 100%;
            min-height: 45px;
            border: none;
            border-radius: 12px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .historie-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .historie-item:last-child {
            border-bottom: none;
        }

        .historie-datum {
            color: #6b7280;
        }

        .leeg {
            color: #6b7280;
            text-align: center;
            padding: 10px 0;
        }

        @media (max-width: 380px) {

            .container {
                padding-left: 12px;
                padding-right: 12px;
            }

            #total-vermogen {
                font-size: 32px;
            }

            .section {
                padding: 17px;
            }

            .rekening-acties button {
                padding: 7px 8px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>Mijn Vermogen</h1>


    <!-- TOTAAL VERMOGEN -->

    <section class="section total-card">

        <div class="total-label">
            Totaal vermogen
        </div>

        <div id="total-vermogen">
            € 0,00
        </div>

    </section>


    <!-- HISTORIE / GRAFIEK -->

    <section class="section">

        <h2>Vermogensontwikkeling</h2>

        <div class="periode-buttons">

            <button
                onclick="zetPeriode('3m')"
                id="btn-3m"
            >
                3 maanden
            </button>

            <button
                onclick="zetPeriode('1j')"
                id="btn-1j"
            >
                1 jaar
            </button>

            <button
                onclick="zetPeriode('alles')"
                id="btn-alles"
            >
                Alles
            </button>

        </div>

        <div
            id="groeiInfo"
            class="groei-info"
        ></div>

        <canvas
            id="vermogenGrafiek"
            height="250"
        ></canvas>

        <br>

        <button
            class="primary-button"
            onclick="vermogensMomentOpslaan()"
        >
            Vermogensmoment opslaan
        </button>

    </section>


    <!-- REKENINGEN -->

    <section class="section">

        <h2>Mijn rekeningen</h2>

        <div id="rekeningen"></div>

    </section>


    <!-- REKENING TOEVOEGEN -->

    <section class="section">

        <h2>Vermogen toevoegen</h2>

        <button
            class="primary-button"
            onclick="rekeningToevoegen()"
        >
            + Rekening toevoegen
        </button>

    </section>


    <!-- HISTORIE -->

    <section class="section">

<h2>Historie</h2>

<div id="historie"></div>

<br>

<button
    class="primary-button"
    onclick="historischMomentToevoegen()"
>
    + Historisch vermogensmoment
</button>

<br><br>

<button
    class="danger-button"
    onclick="historieWissen()"
>
    Historie wissen
</button>

    </section>

</div>


<script>


/*
 * ==========================================
 * DATA
 * ==========================================
 */

let rekeningen = JSON.parse(
    localStorage.getItem("mijnVermogenRekeningen")
) || [];

let historie = JSON.parse(
    localStorage.getItem("mijnVermogenHistorie")
) || [];

let huidigePeriode = "alles";


/*
 * ==========================================
 * OPSLAAN
 * ==========================================
 */

function slaRekeningenOp() {

    localStorage.setItem(
        "mijnVermogenRekeningen",
        JSON.stringify(rekeningen)
    );

}


function slaHistorieOp() {

    localStorage.setItem(
        "mijnVermogenHistorie",
        JSON.stringify(historie)
    );

}


/*
 * ==========================================
 * BEDRAG OPMAKEN
 * ==========================================
 */

function formatteerBedrag(bedrag) {

    return new Intl.NumberFormat(
        "nl-NL",
        {
            style: "currency",
            currency: "EUR"
        }
    ).format(bedrag);

}


/*
 * ==========================================
 * DATUM OPMAKEN
 * ==========================================
 */

function formatteerDatum(datum) {

    return new Date(datum).toLocaleDateString(
        "nl-NL",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/*
 * ==========================================
 * TOTAAL BEREKENEN
 * ==========================================
 */

function berekenTotaal() {

    let totaal = 0;

    rekeningen.forEach(function(rekening) {

        totaal += Number(rekening.bedrag) || 0;

    });

    document.getElementById(
        "total-vermogen"
    ).textContent = formatteerBedrag(totaal);

}


/*
 * ==========================================
 * REKENINGEN TONEN
 * ==========================================
 */

function toonRekeningen() {

    const container =
        document.getElementById("rekeningen");

    container.innerHTML = "";


    if (rekeningen.length === 0) {

        container.innerHTML =
            '<div class="leeg">Nog geen rekeningen toegevoegd.</div>';

        return;

    }


    rekeningen.forEach(function(rekening) {

        const div =
            document.createElement("div");

        div.className = "rekening";


        div.innerHTML = `

            <div class="rekening-info">

                <div class="rekening-naam">
                    ${rekening.naam}
                </div>

                <div class="rekening-type">
                    ${rekening.type}
                </div>

            </div>


            <div class="rekening-bedrag">
                ${formatteerBedrag(rekening.bedrag)}
            </div>


            <div class="rekening-acties">

                <button
                    onclick="rekeningBewerken(${rekening.id})"
                >
                    ✏️
                </button>

                <button
                    onclick="rekeningVerwijderen(${rekening.id})"
                >
                    🗑️
                </button>

            </div>

        `;


        container.appendChild(div);

    });

}


/*
 * ==========================================
 * REKENING TOEVOEGEN
 * ==========================================
 */

function rekeningToevoegen() {

    const naam = prompt(
        "Naam van de rekening, bijvoorbeeld: ING Spaarrekening"
    );


    if (!naam) {
        return;
    }


    /*
     * Type kiezen via een echt keuzemenu
     */

    const typeKeuze =
        document.createElement("select");


    typeKeuze.innerHTML = `

        <option value="">
            Kies type rekening
        </option>

        <option value="Sparen">
            🏦 Sparen
        </option>

        <option value="Beleggen">
            📈 Beleggen
        </option>

        <option value="Betaalrekening">
            💳 Betaalrekening
        </option>

        <option value="Overig">
            📦 Overig
        </option>

    `;


    /*
     * Styling keuzemenu
     */

    typeKeuze.style.width = "100%";
    typeKeuze.style.padding = "12px";
    typeKeuze.style.fontSize = "16px";
    typeKeuze.style.borderRadius = "10px";
    typeKeuze.style.border =
        "1px solid #d1d5db";
    typeKeuze.style.marginBottom = "10px";
    typeKeuze.style.boxSizing = "border-box";


    /*
     * Container voor het menu
     */

    const keuzeContainer =
        document.createElement("div");


    keuzeContainer.style.position = "fixed";
    keuzeContainer.style.left = "50%";
    keuzeContainer.style.top = "50%";
    keuzeContainer.style.transform =
        "translate(-50%, -50%)";
    keuzeContainer.style.background = "white";
    keuzeContainer.style.padding = "20px";
    keuzeContainer.style.borderRadius = "18px";
    keuzeContainer.style.width = "90%";
    keuzeContainer.style.maxWidth = "400px";
    keuzeContainer.style.boxShadow =
        "0 10px 40px rgba(0,0,0,0.2)";
    keuzeContainer.style.zIndex = "9999";
    keuzeContainer.style.boxSizing = "border-box";


    /*
     * Titel
     */

    const titel =
        document.createElement("div");

    titel.textContent =
        "Type rekening";

    titel.style.fontSize = "18px";
    titel.style.fontWeight = "600";
    titel.style.marginBottom = "12px";


    /*
     * Doorgaan-knop
     */

    const bevestigButton =
        document.createElement("button");

    bevestigButton.textContent =
        "Doorgaan";

    bevestigButton.style.width = "100%";
    bevestigButton.style.padding = "12px";
    bevestigButton.style.border = "none";
    bevestigButton.style.borderRadius = "10px";
    bevestigButton.style.background = "#111827";
    bevestigButton.style.color = "white";
    bevestigButton.style.fontSize = "16px";
    bevestigButton.style.fontWeight = "600";
    bevestigButton.style.cursor = "pointer";


    /*
     * Alles toevoegen aan het venster
     */

    keuzeContainer.appendChild(titel);

    keuzeContainer.appendChild(typeKeuze);

    keuzeContainer.appendChild(
        bevestigButton
    );


    document.body.appendChild(
        keuzeContainer
    );


    /*
     * Doorgaan
     */

    bevestigButton.onclick = function() {

        const typeNaam =
            typeKeuze.value;


        if (!typeNaam) {

            alert(
                "Kies eerst een type rekening."
            );

            return;

        }


        /*
         * Keuzemenu verwijderen
         */

        keuzeContainer.remove();


        /*
         * Bedrag vragen
         */

        const bedragInput = prompt(
            "Huidig bedrag in euro's:"
        );


        if (!bedragInput) {
            return;
        }


        const bedrag = parseFloat(
            bedragInput.replace(",", ".")
        );


        if (isNaN(bedrag)) {

            alert(
                "Vul een geldig bedrag in."
            );

            return;

        }


        /*
         * Rekening toevoegen
         */

        rekeningen.push({

            id: Date.now(),

            naam: naam,

            type: typeNaam,

            bedrag: bedrag

        });


        /*
         * Opslaan en scherm vernieuwen
         */

        slaRekeningenOp();

        toonRekeningen();

        berekenTotaal();

    };

}


/*
 * ==========================================
 * REKENING BEWERKEN
 * ==========================================
 */

function rekeningBewerken(id) {

    const rekening =
        rekeningen.find(function(item) {

            return item.id === id;

        });


    if (!rekening) {
        return;
    }


    const nieuweNaam = prompt(
        "Naam:",
        rekening.naam
    );


    if (!nieuweNaam) {
        return;
    }


    const nieuwType = prompt(
        "Type:",
        rekening.type
    );


    if (!nieuwType) {
        return;
    }


    const nieuwBedragInput = prompt(
        "Bedrag:",
        rekening.bedrag
    );


    if (!nieuwBedragInput) {
        return;
    }


    const nieuwBedrag = parseFloat(
        nieuwBedragInput.replace(",", ".")
    );


    if (isNaN(nieuwBedrag)) {

        alert(
            "Vul een geldig bedrag in."
        );

        return;

    }


    rekening.naam = nieuweNaam;

    rekening.type = nieuwType;

    rekening.bedrag = nieuwBedrag;


    slaRekeningenOp();

    toonRekeningen();

    berekenTotaal();

}


/*
 * ==========================================
 * REKENING VERWIJDEREN
 * ==========================================
 */

function rekeningVerwijderen(id) {

    const rekening =
        rekeningen.find(function(item) {

            return item.id === id;

        });


    if (!rekening) {
        return;
    }


    const bevestigen = confirm(
        "Wil je " +
        rekening.naam +
        " verwijderen?"
    );


    if (!bevestigen) {
        return;
    }


    rekeningen =
        rekeningen.filter(function(item) {

            return item.id !== id;

        });


    slaRekeningenOp();

    toonRekeningen();

    berekenTotaal();

}


/*
 * ==========================================
 * VERMOGENSMOMENT OPSLAAN
 * ==========================================
 */

function vermogensMomentOpslaan() {

    let totaal = 0;


    rekeningen.forEach(function(rekening) {

        totaal += Number(rekening.bedrag) || 0;

    });


    historie.push({

        datum: new Date().toISOString(),

        bedrag: totaal

    });


    slaHistorieOp();

    toonHistorie();

    tekenGrafiek();

}

    /*
 * ==========================================
 * HISTORIE TONEN
 * ==========================================
 */

function toonHistorie() {

    const container = document.getElementById("historie");

    container.innerHTML = "";

    if (historie.length === 0) {
        container.innerHTML =
            '<div class="leeg">Nog geen vermogensmomenten opgeslagen.</div>';
        return;
    }

    historie.forEach(function(moment, index) {

        const div = document.createElement("div");
        div.className = "historie-item";

        const datum = document.createElement("div");
        datum.className = "historie-datum";
        datum.textContent = formatteerDatum(moment.datum);

        const bedrag = document.createElement("div");
        bedrag.textContent = formatteerBedrag(moment.bedrag);

        const verwijderButton = document.createElement("button");
        verwijderButton.type = "button";
        verwijderButton.textContent = "🗑️";
        verwijderButton.title = "Dit vermogensmoment verwijderen";
        verwijderButton.setAttribute(
            "aria-label",
            "Vermogensmoment van " + formatteerDatum(moment.datum) + " verwijderen"
        );

        verwijderButton.style.border = "none";
        verwijderButton.style.borderRadius = "8px";
        verwijderButton.style.padding = "6px 10px";
        verwijderButton.style.background = "#f3f4f6";
        verwijderButton.style.cursor = "pointer";

        verwijderButton.onclick = function() {
            historischMomentVerwijderen(index);
        };

        div.appendChild(datum);
        div.appendChild(bedrag);
        div.appendChild(verwijderButton);

        container.appendChild(div);
    });
}
    
    /*
 * ==========================================
 * HISTORISCH VERMOGENSMOMENT TOEVOEGEN
 * ==========================================
 */

function historischMomentToevoegen() {

    const datumInput = prompt(
        "Datum (bijvoorbeeld 01-01-2025):"
    );

    if (!datumInput) {
        return;
    }


    /*
     * Nederlandse datum omzetten
     * naar een datum die JavaScript begrijpt.
     */

    const delen = datumInput.split("-");


    if (delen.length !== 3) {

        alert(
            "Gebruik het formaat DD-MM-JJJJ, bijvoorbeeld 01-01-2025."
        );

        return;

    }


    const dag = parseInt(delen[0]);

    const maand = parseInt(delen[1]);

    const jaar = parseInt(delen[2]);


    const datum = new Date(
        jaar,
        maand - 1,
        dag
    );


    /*
     * Controleren of de datum geldig is.
     */

    if (
        datum.getFullYear() !== jaar ||
        datum.getMonth() !== maand - 1 ||
        datum.getDate() !== dag
    ) {

        alert(
            "Vul een geldige datum in."
        );

        return;

    }

    /*
 * Controleren dat de datum niet in de toekomst ligt.
 */

const vandaag = new Date();

vandaag.setHours(0, 0, 0, 0);

if (datum > vandaag) {

    alert(
        "Oeps, deze datum ligt in de toekomst!"
    );

    return;

}


    const bedragInput = prompt(
        "Totaal vermogen op deze datum in euro's:"
    );


    if (!bedragInput) {
        return;
    }


    const bedrag = parseFloat(
        bedragInput
            .replace("€", "")
            .replace(/\./g, "")
            .replace(",", ".")
            .trim()
    );


    if (isNaN(bedrag)) {

        alert(
            "Vul een geldig bedrag in."
        );

        return;

    }


    historie.push({

        datum: datum.toISOString(),

        bedrag: bedrag

    });


    /*
     * Historie chronologisch sorteren.
     */

    historie.sort(function(a, b) {

        return new Date(a.datum) - new Date(b.datum);

    });


    slaHistorieOp();

    toonHistorie();

    tekenGrafiek();

}

/*
 * ==========================================
 * ÉÉN HISTORISCH VERMOGENSMOMENT VERWIJDEREN
 * ==========================================
 */

function historischMomentVerwijderen(index) {

    const moment = historie[index];

    if (!moment) {
        return;
    }

    const bevestigen = confirm(
        "Wil je het vermogensmoment van " +
        formatteerDatum(moment.datum) +
        " (" +
        formatteerBedrag(moment.bedrag) +
        ") verwijderen?"
    );

    if (!bevestigen) {
        return;
    }

    historie.splice(index, 1);

    slaHistorieOp();
    toonHistorie();
    tekenGrafiek();
}
    
/*
 * ==========================================
 * HISTORIE WISSEN
 * ==========================================
 */

function historieWissen() {

    if (historie.length === 0) {
        return;
    }


    const bevestigen = confirm(
        "Weet je zeker dat je alle historie wilt wissen?"
    );


    if (!bevestigen) {
        return;
    }


    historie = [];


    slaHistorieOp();

    toonHistorie();

    tekenGrafiek();

    updateGroeiInfo([]);

}


/*
 * ==========================================
 * PERIODE INSTELLEN
 * ==========================================
 */

function zetPeriode(periode) {

    huidigePeriode = periode;


    document
        .getElementById("btn-3m")
        .classList.remove("active");

    document
        .getElementById("btn-1j")
        .classList.remove("active");

    document
        .getElementById("btn-alles")
        .classList.remove("active");


    if (periode === "3m") {

        document
            .getElementById("btn-3m")
            .classList.add("active");

    }


    if (periode === "1j") {

        document
            .getElementById("btn-1j")
            .classList.add("active");

    }


    if (periode === "alles") {

        document
            .getElementById("btn-alles")
            .classList.add("active");

    }


    tekenGrafiek();

}


/*
 * ==========================================
 * GROEI INFORMATIE
 * ==========================================
 */

function updateGroeiInfo(gegevens) {

    const element =
        document.getElementById("groeiInfo");


    if (!gegevens || gegevens.length < 2) {

        element.textContent =
            "Nog onvoldoende gegevens voor groei.";

        return;

    }


    const eerste =
        gegevens[0].bedrag;

    const laatste =
        gegevens[gegevens.length - 1].bedrag;


    const verschil =
        laatste - eerste;


    const percentage =
        eerste !== 0
            ? (verschil / eerste) * 100
            : 0;


    const teken =
        verschil >= 0 ? "+" : "";


    element.textContent =
        "Groei: " +
        teken +
        formatteerBedrag(verschil) +
        " (" +
        teken +
        percentage.toFixed(1) +
        "%)";

}


/*
 * ==========================================
 * GRAFIEK TEKENEN
 * ==========================================
 */

function tekenGrafiek() {

    const canvas =
        document.getElementById(
            "vermogenGrafiek"
        );


    if (!canvas) {
        return;
    }


    const ctx =
        canvas.getContext("2d");


    const breedte =
        canvas.clientWidth;


    const hoogte = 250;


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        breedte * dpr;

    canvas.height =
        hoogte * dpr;


    ctx.scale(dpr, dpr);


    ctx.clearRect(
        0,
        0,
        breedte,
        hoogte
    );


    let gegevens =
        [...historie];


    /*
     * Periode filteren
     */

    if (huidigePeriode === "3m") {

        const grens =
            new Date();

        grens.setMonth(
            grens.getMonth() - 3
        );


        gegevens =
            gegevens.filter(function(item) {

                return new Date(item.datum) >= grens;

            });

    }


    if (huidigePeriode === "1j") {

        const grens =
            new Date();

        grens.setFullYear(
            grens.getFullYear() - 1
        );


        gegevens =
            gegevens.filter(function(item) {

                return new Date(item.datum) >= grens;

            });

    }


    updateGroeiInfo(gegevens);


    if (gegevens.length === 0) {

        ctx.fillStyle = "#6b7280";

        ctx.font = "14px sans-serif";

        ctx.textAlign = "center";

        ctx.fillText(
            "Nog geen gegevens",
            breedte / 2,
            hoogte / 2
        );

        return;

    }


    /*
     * Waarden bepalen
     */

    const waarden =
        gegevens.map(function(item) {

            return Number(item.bedrag);

        });


    const minimum =
        Math.min(...waarden);

    const maximum =
        Math.max(...waarden);


    const marge =
        maximum === minimum
            ? 100
            : (maximum - minimum) * 0.15;


    const minWaarde =
        minimum - marge;

    const maxWaarde =
        maximum + marge;


    const paddingLinks = 10;

    const paddingRechts = 10;

    const paddingBoven = 20;

    const paddingOnder = 25;


    const grafiekBreedte =
        breedte -
        paddingLinks -
        paddingRechts;


    const grafiekHoogte =
        hoogte -
        paddingBoven -
        paddingOnder;


    /*
     * Lijn tekenen
     */

    ctx.beginPath();


    gegevens.forEach(function(item, index) {

        const x =
            paddingLinks +
            (
                index /
                Math.max(
                    gegevens.length - 1,
                    1
                )
            ) *
            grafiekBreedte;


        const y =
            paddingBoven +
            (
                1 -
                (
                    (item.bedrag - minWaarde) /
                    (maxWaarde - minWaarde)
                )
            ) *
            grafiekHoogte;


        if (index === 0) {

            ctx.moveTo(x, y);

        } else {

            ctx.lineTo(x, y);

        }

    });


    ctx.strokeStyle = "#111827";

    ctx.lineWidth = 3;

    ctx.lineJoin = "round";

    ctx.lineCap = "round";

    ctx.stroke();


    /*
     * Punten tekenen
     */

    gegevens.forEach(function(item, index) {

        const x =
            paddingLinks +
            (
                index /
                Math.max(
                    gegevens.length - 1,
                    1
                )
            ) *
            grafiekBreedte;


        const y =
            paddingBoven +
            (
                1 -
                (
                    (item.bedrag - minWaarde) /
                    (maxWaarde - minWaarde)
                )
            ) *
            grafiekHoogte;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#111827";

        ctx.fill();

    });

}


/*

 * APP STARTEN

 */

toonRekeningen();

berekenTotaal();

toonHistorie();

zetPeriode("alles");


/*
 * Grafiek opnieuw tekenen wanneer
 * schermgrootte verandert.
 */

window.addEventListener(
    "resize",
    tekenGrafiek
);


</script>
