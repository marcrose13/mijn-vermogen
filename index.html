<!DOCTYPE html>

<html lang="nl">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Saldootje</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="Saldootje-icon.png">
<link rel="stylesheet" href="./style.css?v=2">

</head>

<body>

<div class="container">


<!-- TITEL + INSTELLINGEN -->


<div class="header">

    <div class="header-merk">
<svg class="saldootje-logo" viewBox="0 0 48 48" aria-hidden="true">
    <rect x="4" y="29" width="9" height="13" rx="3" fill="#91BDEB"/>
    <rect x="17" y="21" width="9" height="21" rx="3" fill="#4F83D9"/>
    <rect x="30" y="12" width="9" height="30" rx="3" fill="#244B82"/>
    <path d="M25 12 C25 4 34 2 39 3 C39 10 34 15 25 16 Z" fill="#244B82"/>
    <path d="M24 15 C17 15 14 10 15 5 C21 5 25 9 25 14 Z" fill="#4F83D9"/>
</svg>


        <h1>Saldootje</h1>
    </div>


    <button
        class="instellingen-button"
        onclick="instellingenOpenen()"
        aria-label="Instellingen"
        title="Instellingen"
    >

<svg
    class="instellingen-icoon"
    viewBox="0 0 24 24"
    aria-hidden="true"
>
    <line
        x1="4"
        y1="7"
        x2="20"
        y2="7"
    />

    <line
        x1="4"
        y1="12"
        x2="20"
        y2="12"
    />

    <line
        x1="4"
        y1="17"
        x2="20"
        y2="17"
    />

    <circle
        cx="9"
        cy="7"
        r="1.8"
    />

    <circle
        cx="15"
        cy="12"
        r="1.8"
    />

    <circle
        cx="10"
        cy="17"
        r="1.8"
    />
</svg>

    </button>

</div>


<!-- TOTAAL VERMOGEN -->

<section class="section total-card">

    <div class="total-label">
        Totaal vermogen
    </div>

    <div id="total-vermogen">
        € 0,00
    </div>


    <div
        id="doel-container"
        class="doel-container"
        style="display: none;"
    >

        <div class="doel-header">

            <span>
                Vermogensdoel
            </span>

            <span id="doel-percentage">
                0%
            </span>

        </div>


        <div class="doel-balk">

            <div
                id="doel-balk-vulling"
                class="doel-balk-vulling"
            ></div>

        </div>


        <div
            id="doel-tekst"
            class="doel-tekst"
        >
            € 0 van € 0
        </div>

    </div>

</section>


<!-- HISTORIE / GRAFIEK -->

<section class="section grafiek-card">

    <h2>Vermogensontwikkeling</h2>

    <div class="periode-buttons">

        <button
            onclick="zetPeriode('3m')"
            id="btn-3m"
        >
            3 maanden
        </button>

        <button
            onclick="zetPeriode('1j')"
            id="btn-1j"
        >
            1 jaar
        </button>

        <button
            onclick="zetPeriode('alles')"
            id="btn-alles"
        >
            Alles
        </button>

    </div>

    <div
        id="groeiInfo"
        class="groei-info"
    ></div>


    <!-- GRAFIEK -->

    <div
        class="grafiek-wrapper"
        id="grafiekWrapper"
    >

        <canvas
            id="vermogenGrafiek"
            height="290"
        ></canvas>

        <div
            id="grafiekTooltip"
            class="grafiek-tooltip"
            aria-hidden="true"
        ></div>

    </div>

<br>

</section>


<!-- REKENINGEN -->


<!-- REKENINGEN -->

<section class="section">

    <h2>Mijn rekeningen</h2>

    <div id="rekeningen"></div>

    <button
        class="primary-button"
        onclick="rekeningToevoegen()"
    >
        + Rekening toevoegen
    </button>

</section>


<!-- HISTORIE -->

<section class="section" id="historie-container" style="display: none;">

    <h2>Historie</h2>

    <div id="historie"></div>

<br>

    <button
        class="primary-button"
        onclick="historischMomentToevoegen()"
    >
        + Historisch vermogensmoment
    </button>

<br><br>

    <button
        class="danger-button"
        onclick="historieWissen()"
    >
        Historie wissen
    </button>

</section>


</div>

<script src="script.js"></script>

</body>

</html>
