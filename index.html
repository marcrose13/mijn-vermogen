<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mijn Vermogen</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        background: #C5DEDE;
    }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, Arial, sans-serif;
        background: #C5DEDE;
        color: #1f2937;
        -webkit-font-smoothing: antialiased;
    }

    .container {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        padding: 24px 16px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(30px, env(safe-area-inset-bottom));
    }

    /* =========================
       HEADER
       ========================= */

    header {
        margin-bottom: 22px;
        padding: 0 4px;
    }

    h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.15;
        letter-spacing: -0.5px;
    }

    .subtitle {
        margin-top: 7px;
        color: #6b7280;
        font-size: 15px;
    }

    /* =========================
       KAARTEN
       ========================= */

    .total-card,
    .section {
        background: white;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .total-card {
        padding: 24px 20px;
        margin-bottom: 16px;
    }

    .section {
        padding: 20px;
        margin-bottom: 16px;
    }

    /* =========================
       TOTAAL VERMOGEN
       ========================= */

    .total-label {
        color: #6b7280;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 6px;
    }

    .total-value {
        font-size: 38px;
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -1px;
    }

    /* =========================
       SECTIES
       ========================= */

    .section h2 {
        margin: 0 0 14px 0;
        font-size: 20px;
        line-height: 1.3;
    }

    /* =========================
       REKENINGEN
       ========================= */

    .account {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 0;
        border-bottom: 1px solid #eeeeee;
        gap: 12px;
    }

    .account:last-child {
        border-bottom: none;
    }

    .account-info {
        min-width: 0;
        flex: 1;
    }

    .account-name {
        font-weight: 600;
        font-size: 16px;
        line-height: 1.3;
    }

    .account-type {
        font-size: 13px;
        color: #6b7280;
        margin-top: 4px;
    }

    .account-right {
        text-align: right;
        white-space: nowrap;
    }

    .account-value {
        font-weight: 600;
        font-size: 16px;
        margin-bottom: 7px;
    }

    .account-actions {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
    }

    .small-button {
        width: auto;
        min-height: 34px;
        padding: 7px 10px;
        border-radius: 9px;
        font-size: 12px;
        font-weight: 500;
        background: #f3f4f6;
        color: #374151;
        border: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .small-button:hover {
        background: #e5e7eb;
    }

    .delete-button {
        color: #b91c1c;
    }

    .delete-button:hover {
        background: #fee2e2;
    }

    .empty-message {
        color: #6b7280;
        font-size: 14px;
        padding: 10px 0;
    }

    /* =========================
       KNOPPEN
       ========================= */

    button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .primary-button {
        width: 100%;
        min-height: 50px;
        border: none;
        border-radius: 13px;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        background: #111827;
        color: white;
    }

    .primary-button:hover {
        background: #374151;
    }

    .secondary-button {
        width: 100%;
        min-height: 48px;
        border: none;
        border-radius: 13px;
        padding: 12px;
        font-size: 15px;
        font-weight: 600;
        background: #f3f4f6;
        color: #374151;
        margin-top: 10px;
    }

    .secondary-button:hover {
        background: #e5e7eb;
    }

    /* =========================
       PERIODEKNOPPEN
       ========================= */

    .period-buttons {
        display: flex;
        gap: 7px;
        margin: 12px 0 14px;
    }

    .period-buttons button {
        flex: 1;
        min-height: 42px;
        padding: 9px 8px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        background: #f3f4f6;
        color: #374151;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }

    .period-buttons button.active {
        background: #111827;
        border-color: #111827;
        color: #ffffff;
    }

    .growth-info {
        margin: 8px 0 14px;
        color: #374151;
        font-size: 14px;
        font-weight: 600;
    }

    /* =========================
       GRAFIEK
       ========================= */

    .chart-container {
        width: 100%;
        overflow-x: auto;
        border-radius: 12px;
    }

    canvas {
        width: 100%;
        height: 280px;
        display: block;
    }

    /* =========================
       HISTORIE
       ========================= */

    .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        padding: 14px 0;
        border-bottom: 1px solid #eeeeee;
    }

    .history-item:last-child {
        border-bottom: none;
    }

    .history-date {
        color: #6b7280;
        font-size: 14px;
    }

    .history-value {
        font-weight: 600;
        font-size: 15px;
        white-space: nowrap;
    }

    /* =========================
       FOOTER
       ========================= */

    footer {
        text-align: center;
        color: #9ca3af;
        font-size: 13px;
        margin-top: 26px;
        padding-bottom: 10px;
    }

    /* =========================
       EXTRA KLEINE SCHERMEN
       ========================= */

    @media (max-width: 380px) {
        .container {
            padding-left: 12px;
            padding-right: 12px;
        }

        .section {
            padding: 17px;
        }

        .total-card {
            padding: 21px 17px;
        }

        .total-value {
            font-size: 34px;
        }

        .account {
            gap: 8px;
        }

        .account-value {
            font-size: 15px;
        }

        .period-buttons button {
            font-size: 13px;
            padding-left: 5px;
            padding-right: 5px;
        }
    }
</style>
    
</head>

<body>

<div class="container">

    <header>
        <h1>Mijn Vermogen</h1>

        <div class="subtitle">
            Overzicht van je spaargeld en beleggingen
        </div>
    </header>


    <!-- TOTAAL VERMOGEN -->

    <section class="total-card">

        <div class="total-label">
            Totaal vermogen
        </div>

        <div class="total-value" id="total-vermogen">
            € 0,00
        </div>

    </section>


    <!-- HISTORIE -->

    <section class="section">

        <h2>Vermogensontwikkeling</h2>

<div class="period-buttons">
    <button onclick="zetPeriode('3m')" id="btn-3m">
        3 maanden
    </button>

    <button onclick="zetPeriode('1j')" id="btn-1j">
        1 jaar
    </button>

    <button onclick="zetPeriode('alles')" id="btn-alles">
        Alles
    </button>
</div>

<div class="growth-info" id="groeiInfo">
    Nog geen historische gegevens
</div>

<div class="chart-container">
    <canvas id="vermogenGrafiek"></canvas>
</div>

<button
    class="primary-button"
    onclick="vermogensMomentOpslaan()"
>
    + Vermogen bijwerken
</button>
        

    </section>


    <!-- REKENINGEN -->

    <section class="section">

        <h2>Mijn rekeningen</h2>

        <div id="rekeningen"></div>

    </section>


    <!-- TOEVOEGEN -->

    <section class="section">

        <h2>Vermogen toevoegen</h2>

        <button
            class="primary-button"
            onclick="rekeningToevoegen()"
        >
            + Rekening toevoegen
        </button>

    </section>


    <!-- HISTORISCHE MOMENTEN -->

    <section class="section">

        <h2>Historie</h2>

        <div id="historie"></div>

        <button
            class="secondary-button"
            onclick="historieWissen()"
        >
            Historie wissen
        </button>

    </section>


    <footer>
        Mijn Vermogen
    </footer>

</div>


<script>

    /*
     * ==========================================
     * GEGEVENS LADEN
     * ==========================================
     */

    let rekeningen = JSON.parse(
        localStorage.getItem("mijnVermogenRekeningen")
    ) || [];


    let historie = JSON.parse(
        localStorage.getItem("mijnVermogenHistorie")
    ) || [];


    /*
     * ==========================================
     * GEGEVENS OPSLAAN
     * ==========================================
     */

    function slaRekeningenOp() {

        localStorage.setItem(
            "mijnVermogenRekeningen",
            JSON.stringify(rekeningen)
        );

    }


    function slaHistorieOp() {

        localStorage.setItem(
            "mijnVermogenHistorie",
            JSON.stringify(historie)
        );

    }


    /*
     * ==========================================
     * TOTAAL BEREKENEN
     * ==========================================
     */

    function berekenTotaal() {

        let totaal = 0;

        rekeningen.forEach(function(rekening) {

            totaal += rekening.bedrag;

        });


        document.getElementById(
            "total-vermogen"
        ).textContent = formatteerBedrag(totaal);


        return totaal;

    }


    /*
     * ==========================================
     * BEDRAG FORMATTEREN
     * ==========================================
     */

    function formatteerBedrag(bedrag) {

        return new Intl.NumberFormat("nl-NL", {

            style: "currency",

            currency: "EUR"

        }).format(bedrag);

    }


    /*
     * ==========================================
     * DATUM FORMATTEREN
     * ==========================================
     */

    function formatteerDatum(datum) {

        return new Intl.DateTimeFormat(
            "nl-NL",
            {
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        ).format(new Date(datum));

    }


    /*
     * ==========================================
     * REKENINGEN WEERGEVEN
     * ==========================================
     */

    function toonRekeningen() {

        const container =
            document.getElementById("rekeningen");

        container.innerHTML = "";


        if (rekeningen.length === 0) {

            container.innerHTML = `
                <div class="empty-message">
                    Nog geen rekeningen toegevoegd.
                </div>
            `;

            return;
        }


        rekeningen.forEach(function(rekening) {

            const element =
                document.createElement("div");

            element.className = "account";


            element.innerHTML = `

                <div class="account-info">

                    <div class="account-name">
                        ${rekening.naam}
                    </div>

                    <div class="account-type">
                        ${rekening.type}
                    </div>

                </div>


                <div class="account-right">

                    <div class="account-value">
                        ${formatteerBedrag(rekening.bedrag)}
                    </div>

                    <div class="account-actions">

                        <button
                            class="small-button"
                            onclick="rekeningBewerken(${rekening.id})"
                        >
                            Bewerken
                        </button>

                        <button
                            class="small-button delete-button"
                            onclick="rekeningVerwijderen(${rekening.id})"
                        >
                            Verwijderen
                        </button>

                    </div>

                </div>

            `;


            container.appendChild(element);

        });

    }


    /*
     * ==========================================
     * REKENING TOEVOEGEN
     * ==========================================
     */

function rekeningToevoegen() {

    const naam = prompt(
        "Naam van de rekening, bijvoorbeeld: ING Spaarrekening"
    );

    if (!naam) {
        return;
    }

    const type = prompt(
    "Kies het type rekening:\n\n" +
    "Sparen\n" +
    "Beleggen\n" +
    "Betaalrekening\n" +
    "Overig\n\n" +
    "Typ precies één van bovenstaande opties:"
);

if (!type) {
    return;
}

const mogelijkeTypes = [
    "Sparen",
    "Beleggen",
    "Betaalrekening",
    "Overig"
];

const typeNaam = mogelijkeTypes.find(
    optie => optie.toLowerCase() === type.toLowerCase()
);

if (!typeNaam) {
    alert(
        "Ongeldige keuze. Kies Sparen, Beleggen, Betaalrekening of Overig."
    );
    return;
}
    
    const bedragInput = prompt(
        "Huidig bedrag in euro's:"
    );

    if (!bedragInput) {
        return;
    }

    const bedrag = parseFloat(
        bedragInput.replace(",", ".")
    );

    if (isNaN(bedrag)) {
        alert("Vul een geldig bedrag in.");
        return;
    }

    rekeningen.push({

        id: Date.now(),

        naam: naam,

        type: typeNaam,

        bedrag: bedrag

    });

    slaRekeningenOp();

    toonRekeningen();

    berekenTotaal();
}


    /*
     * ==========================================
     * REKENING BEWERKEN
     * ==========================================
     */

    function rekeningBewerken(id) {

        const rekening = rekeningen.find(
            function(item) {
                return item.id === id;
            }
        );


        if (!rekening) {
            return;
        }


        const nieuweNaam = prompt(
            "Naam van de rekening:",
            rekening.naam
        );


        if (!nieuweNaam) {
            return;
        }


        const nieuwType = prompt(
            "Type:",
            rekening.type
        );


        if (!nieuwType) {
            return;
        }


        const nieuwBedragInput = prompt(
            "Huidig bedrag in euro's:",
            rekening.bedrag
        );


        if (!nieuwBedragInput) {
            return;
        }


        const nieuwBedrag = parseFloat(
            nieuwBedragInput.replace(",", ".")
        );


        if (isNaN(nieuwBedrag)) {

            alert("Vul een geldig bedrag in.");

            return;
        }


        rekening.naam = nieuweNaam;

        rekening.type = nieuwType;

        rekening.bedrag = nieuwBedrag;


        slaRekeningenOp();

        toonRekeningen();

        berekenTotaal();

    }


    /*
     * ==========================================
     * REKENING VERWIJDEREN
     * ==========================================
     */

    function rekeningVerwijderen(id) {

        const rekening = rekeningen.find(
            function(item) {
                return item.id === id;
            }
        );


        if (!rekening) {
            return;
        }


        const bevestiging = confirm(
            "Weet je zeker dat je " +
            rekening.naam +
            " wilt verwijderen?"
        );


        if (!bevestiging) {
            return;
        }


        rekeningen = rekeningen.filter(
            function(item) {
                return item.id !== id;
            }
        );


        slaRekeningenOp();

        toonRekeningen();

        berekenTotaal();

    }


    /*
     * ==========================================
     * VERMOGENSMOMENT OPSLAAN
     * ==========================================
     */

    function vermogensMomentOpslaan() {

        const totaal = berekenTotaal();


        if (rekeningen.length === 0) {

            alert(
                "Voeg eerst minimaal één rekening toe."
            );

            return;
        }


        const vandaag =
            new Date().toISOString().split("T")[0];


        /*
         * Als er vandaag al een moment bestaat,
         * vervangen we dat moment.
         */

        const bestaandMoment = historie.find(
            function(moment) {
                return moment.datum === vandaag;
            }
        );


        if (bestaandMoment) {

            bestaandMoment.bedrag = totaal;

        } else {

            historie.push({

                datum: vandaag,

                bedrag: totaal

            });

        }


        /*
         * Oudste eerst
         */

        historie.sort(
            function(a, b) {

                return new Date(a.datum) -
                       new Date(b.datum);

            }
        );


        slaHistorieOp();

        toonHistorie();

        tekenGrafiek();


        alert(
            "Vermogen opgeslagen: " +
            formatteerBedrag(totaal)
        );

    }


    /*
     * ==========================================
     * HISTORIE WEERGEVEN
     * ==========================================
     */

    function toonHistorie() {

        const container =
            document.getElementById("historie");

        container.innerHTML = "";


        if (historie.length === 0) {

            container.innerHTML = `
                <div class="empty-message">
                    Nog geen historische gegevens.
                    Klik op "Vermogen bijwerken" om
                    je eerste moment op te slaan.
                </div>
            `;

            return;
        }


        /*
         * Nieuwste eerst tonen
         */

        const gesorteerd =
            [...historie].reverse();


        gesorteerd.forEach(function(moment) {

            const element =
                document.createElement("div");

            element.className = "history-item";


            element.innerHTML = `

                <div class="history-date">
                    ${formatteerDatum(moment.datum)}
                </div>

                <div class="history-value">
                    ${formatteerBedrag(moment.bedrag)}
                </div>

            `;


            container.appendChild(element);

        });

    }


    /*
     * ==========================================
     * HISTORIE WISSEN
     * ==========================================
     */

    function historieWissen() {

        if (historie.length === 0) {
            return;
        }


        const bevestiging = confirm(
            "Weet je zeker dat je alle historische " +
            "vermogensgegevens wilt verwijderen?"
        );


        if (!bevestiging) {
            return;
        }


        historie = [];


        slaHistorieOp();

        toonHistorie();

        tekenGrafiek();

    }
    
    /*
     * ==========================================
     * GRAFIEK TEKENEN
     * ==========================================
     */

    let huidigePeriode = "alles";

function zetPeriode(periode) {
    huidigePeriode = periode;

    document.querySelectorAll(".period-buttons button").forEach(function(knop) {
        knop.classList.remove("active");
    });

    const actieveKnop = document.getElementById("btn-" + periode);
    if (actieveKnop) {
        actieveKnop.classList.add("active");
    }

    tekenGrafiek();
}

function updateGroeiInfo(gegevens) {
    const element = document.getElementById("groeiInfo");

    if (!element) return;

    if (gegevens.length < 2) {
        element.textContent = "Nog niet genoeg gegevens om groei te berekenen";
        return;
    }

    const eersteBedrag = gegevens[0].bedrag;
    const laatsteBedrag = gegevens[gegevens.length - 1].bedrag;
    const verschil = laatsteBedrag - eersteBedrag;

    const percentage = eersteBedrag !== 0
        ? (verschil / eersteBedrag) * 100
        : null;

    const euro = new Intl.NumberFormat("nl-NL", {
        style: "currency",
        currency: "EUR"
    });

    const teken = verschil > 0 ? "+" : "";

    element.textContent = percentage === null
        ? teken + euro.format(verschil) + " sinds eerste meting"
        : teken + euro.format(verschil) + " (" + teken +
          percentage.toFixed(1).replace(".", ",") + "%) sinds eerste meting";
}
    
    function tekenGrafiek() {

    const canvas = document.getElementById("vermogenGrafiek");
    const ctx = canvas.getContext("2d");

    const width = canvas.parentElement.clientWidth;
    const height = 280;

    canvas.width = width;
    canvas.height = height;

    ctx.clearRect(0, 0, width, height);


    /*
     * Alleen de geselecteerde periode gebruiken
     */

    const nu = new Date();

    let startDatum = null;

    if (huidigePeriode === "3m") {

        startDatum = new Date();
        startDatum.setMonth(
            startDatum.getMonth() - 3
        );

    } else if (huidigePeriode === "1j") {

        startDatum = new Date();
        startDatum.setFullYear(
            startDatum.getFullYear() - 1
        );

    }


    let gegevens = historie.filter(function(moment) {

        if (!startDatum) {
            return true;
        }

        return new Date(moment.datum) >= startDatum;

    });


    /*
     * Geen of te weinig gegevens
     */

    if (gegevens.length < 2) {

        ctx.fillStyle = "#9ca3af";

        ctx.font = "14px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            "Nog niet genoeg gegevens voor een grafiek",
            width / 2,
            height / 2
        );

        updateGroeiInfo(gegevens);

        return;
    }


    /*
     * Waarden bepalen
     */

    const waardes = gegevens.map(function(moment) {
        return moment.bedrag;
    });


    let minWaarde = Math.min(...waardes);
    let maxWaarde = Math.max(...waardes);


    /*
     * Een beetje ruimte boven en onder
     */

    const verschil = maxWaarde - minWaarde;

    if (verschil === 0) {

        minWaarde -= 1000;
        maxWaarde += 1000;

    } else {

        minWaarde -= verschil * 0.1;
        maxWaarde += verschil * 0.1;

    }


    const margeLinks = 15;
    const margeRechts = 15;
    const margeBoven = 20;
    const margeOnder = 35;

    const grafiekBreedte =
        width - margeLinks - margeRechts;

    const grafiekHoogte =
        height - margeBoven - margeOnder;


    /*
     * Horizontale hulplijnen
     */

    ctx.strokeStyle = "#eeeeee";
    ctx.lineWidth = 1;

    for (let i = 0; i <= 3; i++) {

        const y =
            margeBoven +
            (grafiekHoogte / 3) * i;

        ctx.beginPath();

        ctx.moveTo(
            margeLinks,
            y
        );

        ctx.lineTo(
            width - margeRechts,
            y
        );

        ctx.stroke();

    }


    /*
     * Waarden omzetten naar coördinaten
     */

    function berekenY(waarde) {

        return (
            margeBoven +
            grafiekHoogte -
            (
                (waarde - minWaarde) /
                (maxWaarde - minWaarde)
            ) *
            grafiekHoogte
        );

    }


    /*
     * Gebied onder de lijn
     */

    ctx.beginPath();

    gegevens.forEach(function(moment, index) {

        const x =
            margeLinks +
            (
                index /
                (gegevens.length - 1)
            ) *
            grafiekBreedte;

        const y = berekenY(moment.bedrag);


        if (index === 0) {

            ctx.moveTo(x, y);

        } else {

            ctx.lineTo(x, y);

        }

    });


    const laatsteX =
        width - margeRechts;

    const eersteX =
        margeLinks;

    ctx.lineTo(
        laatsteX,
        height - margeOnder
    );

    ctx.lineTo(
        eersteX,
        height - margeOnder
    );

    ctx.closePath();

    ctx.fillStyle = "rgba(17, 24, 39, 0.08)";

    ctx.fill();


    /*
     * Vermogenslijn
     */

    ctx.beginPath();

    gegevens.forEach(function(moment, index) {

        const x =
            margeLinks +
            (
                index /
                (gegevens.length - 1)
            ) *
            grafiekBreedte;

        const y = berekenY(moment.bedrag);


        if (index === 0) {

            ctx.moveTo(x, y);

        } else {

            ctx.lineTo(x, y);

        }

    });


    ctx.strokeStyle = "#111827";

    ctx.lineWidth = 3;

    ctx.stroke();


    /*
     * Punten tekenen
     */

    gegevens.forEach(function(moment, index) {

        const x =
            margeLinks +
            (
                index /
                (gegevens.length - 1)
            ) *
            grafiekBreedte;

        const y = berekenY(moment.bedrag);


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#111827";

        ctx.fill();

    });


    /*
     * Datumlabels
     */

    ctx.fillStyle = "#9ca3af";

    ctx.font = "11px Arial";

    ctx.textAlign = "center";


    const eersteDatum =
        formatteerDatum(gegevens[0].datum);

    const laatsteDatum =
        formatteerDatum(
            gegevens[gegevens.length - 1].datum
        );


    ctx.fillText(
        eersteDatum,
        margeLinks + 25,
        height - 10
    );


    ctx.fillText(
        laatsteDatum,
        width - margeRechts - 25,
        height - 10
    );


    /*
     * Groei-info bijwerken
     */

        updateGroeiInfo(gegevens);

}

/*
 * ==========================================
 * APP STARTEN
 * ==========================================
 */

toonRekeningen();

berekenTotaal();

toonHistorie();

zetPeriode("alles");


/*
 * Grafiek opnieuw tekenen wanneer
 * schermgrootte verandert.
 */

window.addEventListener(
    "resize",
    tekenGrafiek
);

</script>
