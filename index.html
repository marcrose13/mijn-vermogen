<!DOCTYPE html>

<html lang="nl">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mijn Vermogen</title>

<style>

    :root {
        --app-background: #C5DEDE;
    }

    html {
        background: var(--app-background);
    }

    body {
        margin: 0;
        padding: 0;
        background: var(--app-background);
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        color: #111827;
        -webkit-font-smoothing: antialiased;
    }

    .container {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        padding:
            calc(20px + env(safe-area-inset-top))
            16px
            calc(30px + env(safe-area-inset-bottom))
            16px;
        box-sizing: border-box;
    }


    /*
     * ==========================================
     * TITEL + INSTELLINGEN
     * ==========================================
     */

    .header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 10px 0 25px;
    }

    h1 {
        margin: 0;
        font-size: 30px;
    }

    .instellingen-button {
        position: absolute;
        right: 0;
        top: calc(50% + 2px);
        transform: translateY(-50%);

        width: 42px;
        height: 42px;

        border: none;
        border-radius: 12px;

        background: rgba(255, 255, 255, 0.75);

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        transition:
            transform 0.15s ease,
            background 0.15s ease;
    }

    .instellingen-button:active {
        transform:
            translateY(-50%)
            scale(0.94);
    }

    .instellingen-button:hover {
        background: white;
    }

    .instellingen-icoon {
        width: 21px;
        height: 21px;

        fill: none;
        stroke: #111827;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    h2 {
        margin-top: 0;
        font-size: 20px;
    }

.section {
    background: rgba(255, 255, 255, 0.92);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 16px;

    border: 1px solid rgba(17, 24, 39, 0.05);

    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.035);
}

 .total-card {
    text-align: left;
    padding: 28px 24px;
}

.total-label {
    font-size: 14px;
    font-weight: 500;
    color: #6b7280;
    margin-bottom: 8px;
}

#total-vermogen {
    font-size: 42px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -1.5px;
    color: #111827;
}

/*
 * ==========================================
 * VERMOGENSDOEL
 * ==========================================
 */

/*
 * ==========================================
 * VERMOGENSDOEL
 * ==========================================
 */

.doel-container {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #eef0f2;
}

.doel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;

    font-size: 13px;
    font-weight: 600;
}

#doel-percentage {
    color: #111827;
    font-weight: 700;
}

.doel-balk {
    width: 100%;
    height: 8px;

    background: #eef0f2;

    border-radius: 999px;

    overflow: hidden;
}

.doel-balk-vulling {
    width: 0%;
    height: 100%;

    background: #111827;

    border-radius: 999px;

    transition:
        width 0.4s ease;
}

.doel-tekst {
    margin-top: 9px;

    font-size: 13px;
    color: #8a919b;

    text-align: left;
}

    .total-label {
        font-size: 15px;
        color: #6b7280;
        margin-bottom: 8px;
    }

    #total-vermogen {
        font-size: 36px;
        font-weight: 700;
    }

    .groei-info {
        margin-top: 8px;
        margin-bottom: 12px;
        font-size: 14px;
        color: #6b7280;
    }

    .periode-buttons {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
    }

    .periode-buttons button {
        flex: 1;
        min-height: 42px;
        border: none;
        border-radius: 10px;
        background: #e5e7eb;
        color: #374151;
        font-size: 14px;
        cursor: pointer;
    }

    .periode-buttons button.active {
        background: #111827;
        color: white;
    }


    /*
     * ==========================================
     * GRAFIEK
     * ==========================================
     */

    .grafiek-wrapper {
        position: relative;
        width: 100%;
        height: 290px;
        touch-action: pan-y;
    }

    .grafiek-wrapper canvas {
        display: block;
        width: 100%;
        height: 290px;
        max-width: 100%;
        cursor: crosshair;
    }

    .grafiek-tooltip {
        position: absolute;
        z-index: 20;

        min-width: 150px;
        max-width: 210px;

        padding: 10px 12px;

        border-radius: 12px;

        background: rgba(17, 24, 39, 0.96);
        color: white;

        font-size: 13px;
        line-height: 1.35;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.18);

        pointer-events: none;

        opacity: 0;

        transform:
            translate(
                -50%,
                calc(-100% - 12px)
            );

        transition:
            opacity 0.12s ease;

        box-sizing: border-box;
    }

    .grafiek-tooltip.visible {
        opacity: 1;
    }

    .grafiek-tooltip.onder {
        transform:
            translate(
                -50%,
                12px
            );
    }

    .grafiek-tooltip-datum {
        color: #d1d5db;
        margin-bottom: 3px;
    }

    .grafiek-tooltip-bedrag {
        font-size: 16px;
        font-weight: 700;
    }

    .grafiek-tooltip-verschil {
        color: #d1d5db;
        margin-top: 3px;
    }


    /*
     * ==========================================
     * REKENINGEN
     * ==========================================
     */

    .rekening {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;

    padding: 17px 0;

    border-bottom: 1px solid #eef0f2;
}

.rekening:last-child {
    border-bottom: none;
}

.rekening-info {
    flex: 1;
    min-width: 0;
}

.rekening-naam {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 5px;
}

.rekening-type {
    font-size: 12px;
    color: #8a919b;
}

.rekening-bedrag {
    font-size: 15px;
    font-weight: 650;
    white-space: nowrap;
}

.rekening-acties {
    display: flex;
    gap: 5px;
}

.rekening-acties button {
    border: none;
    border-radius: 10px;
    padding: 7px 9px;

    background: #f5f6f7;

    cursor: pointer;
}

    .primary-button {
        width: 100%;
        min-height: 50px;
        border: none;
        border-radius: 12px;
        background: #111827;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .secondary-button {
        width: 100%;
        min-height: 45px;
        border: none;
        border-radius: 12px;
        background: #e5e7eb;
        color: #111827;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    .danger-button {
        width: 100%;
        min-height: 45px;
        border: none;
        border-radius: 12px;
        background: #fee2e2;
        color: #991b1b;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    .historie-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid #e5e7eb;
    }

    .historie-item:last-child {
        border-bottom: none;
    }

    .historie-datum {
        color: #6b7280;
        flex: 1;
    }

    .leeg {
        color: #6b7280;
        text-align: center;
        padding: 10px 0;
    }


    /*
     * ==========================================
     * INSTELLINGEN POPUP
     * ==========================================
     */

    .instellingen-popup-overlay {
        position: fixed;
        inset: 0;

        background: rgba(17, 24, 39, 0.45);

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;
        box-sizing: border-box;

        z-index: 10000;
    }

    .instellingen-popup {
        width: 100%;
        max-width: 380px;

        background: white;

        border-radius: 22px;

        padding: 24px;

        box-sizing: border-box;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .instellingen-titel {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .instellingen-subtitel {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 24px;
    }

    .instellingen-label {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
    }

    .kleur-opties {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
    }

    .kleur-optie {
        flex: 1;

        border: 2px solid transparent;

        border-radius: 14px;

        padding: 6px;

        background: #f3f4f6;

        cursor: pointer;

        transition:
            border-color 0.15s ease,
            transform 0.15s ease;
    }

    .kleur-optie:hover {
        transform: translateY(-2px);
    }

    .kleur-optie.active {
        border-color: #111827;
    }

    .kleur-preview {
        width: 100%;
        height: 55px;

        border-radius: 9px;

        margin-bottom: 7px;
    }

    .kleur-naam {
        font-size: 12px;
        font-weight: 600;
        text-align: center;
        color: #374151;
    }


    /*
     * ==========================================
     * REKENING POPUP
     * ==========================================
     */

    .rekening-popup-overlay {
        position: fixed;
        inset: 0;
        background: rgba(17, 24, 39, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
        z-index: 9999;
    }

    .rekening-popup {
        width: 100%;
        max-width: 430px;
        background: white;
        border-radius: 22px;
        padding: 24px;
        box-sizing: border-box;
        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .rekening-popup-titel {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .rekening-popup-subtitel {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 22px;
    }

    .formulier-label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 7px;
    }

    .formulier-groep {
        margin-bottom: 17px;
    }

    .formulier-input,
    .formulier-select {
        width: 100%;
        min-height: 48px;
        padding: 0 13px;
        box-sizing: border-box;
        border: 1px solid #d1d5db;
        border-radius: 11px;
        background: white;
        color: #111827;
        font-family: inherit;
        font-size: 16px;
        outline: none;
    }

    .formulier-input:focus,
    .formulier-select:focus {
        border-color: #111827;
    }

    .popup-knoppen {
        display: flex;
        gap: 10px;
        margin-top: 22px;
    }

    .popup-knoppen button {
        flex: 1;
    }

    @media (max-width: 380px) {

        .container {
            padding-left: 12px;
            padding-right: 12px;
        }

        #total-vermogen {
            font-size: 32px;
        }

        .section {
            padding: 17px;
        }

        .rekening-acties button {
            padding: 7px 8px;
        }

        .rekening-popup {
            padding: 20px;
        }

        .instellingen-popup {
            padding: 20px;
        }

    }

</style>


</head>

<body>

<div class="container">


<!-- TITEL + INSTELLINGEN -->

<div class="header">

    <h1>Mijn Vermogen</h1>

    <button
        class="instellingen-button"
        onclick="instellingenOpenen()"
        aria-label="Instellingen"
        title="Instellingen"
    >

        <svg
            class="instellingen-icoon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path
                d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
            />

            <path
                d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 1.7-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2.4v-.2a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 0 0 8.46 15a1.7 1.7 0 0 0-1.56-1.03H6.7v-2.4h.2A1.7 1.7 0 0 0 8.46 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.7-1.7.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 12.73 5.2V5h2.4v.2a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.7 1.7-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.56 1.03h.2v2.4h-.2A1.7 1.7 0 0 0 19.4 15Z"
            />

        </svg>

    </button>

</div>


<!-- TOTAAL VERMOGEN -->

<section class="section total-card">

    <div class="total-label">
        Totaal vermogen
    </div>

    <div id="total-vermogen">
        € 0,00
    </div>


    <div
        id="doel-container"
        class="doel-container"
        style="display: none;"
    >

        <div class="doel-header">

            <span>
                Vermogensdoel
            </span>

            <span id="doel-percentage">
                0%
            </span>

        </div>


        <div class="doel-balk">

            <div
                id="doel-balk-vulling"
                class="doel-balk-vulling"
            ></div>

        </div>


        <div
            id="doel-tekst"
            class="doel-tekst"
        >
            € 0 van € 0
        </div>

    </div>

</section>


<!-- HISTORIE / GRAFIEK -->

<section class="section">

    <h2>Vermogensontwikkeling</h2>

    <div class="periode-buttons">

        <button
            onclick="zetPeriode('3m')"
            id="btn-3m"
        >
            3 maanden
        </button>

        <button
            onclick="zetPeriode('1j')"
            id="btn-1j"
        >
            1 jaar
        </button>

        <button
            onclick="zetPeriode('alles')"
            id="btn-alles"
        >
            Alles
        </button>

    </div>

    <div
        id="groeiInfo"
        class="groei-info"
    ></div>


    <!-- GRAFIEK -->

    <div
        class="grafiek-wrapper"
        id="grafiekWrapper"
    >

        <canvas
            id="vermogenGrafiek"
            height="290"
        ></canvas>

        <div
            id="grafiekTooltip"
            class="grafiek-tooltip"
            aria-hidden="true"
        ></div>

    </div>


    <br>

    <button
        class="primary-button"
        onclick="vermogensMomentOpslaan()"
    >
        Vermogensmoment opslaan
    </button>

</section>


<!-- REKENINGEN -->

<section class="section">

    <h2>Mijn rekeningen</h2>

    <div id="rekeningen"></div>

</section>


<!-- REKENING TOEVOEGEN -->

<section class="section">

    <h2>Vermogen toevoegen</h2>

    <button
        class="primary-button"
        onclick="rekeningToevoegen()"
    >
        + Rekening toevoegen
    </button>

</section>


<!-- HISTORIE -->

<section class="section">

    <h2>Historie</h2>

    <div id="historie"></div>

    <br>

    <button
        class="primary-button"
        onclick="historischMomentToevoegen()"
    >
        + Historisch vermogensmoment
    </button>

    <br><br>

    <button
        class="danger-button"
        onclick="historieWissen()"
    >
        Historie wissen
    </button>

</section>


</div>

<script src="script.js"></script>

</body>

</html>
